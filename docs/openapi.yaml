openapi: 3.1.0
# The HTTP API of the OpenESL access point. This file is the reference for the API:
# the API tab of the web page shows it, and ap/test/openapi/check_openapi.py runs every
# example in it against the AP code (esl_api.c) and checks every reply against the schemas.
info:
  title: OpenESL AP API
  version: "1"
  description: |
    Any software (the client) calls this small REST API on the access point (AP) when
    content changes. The AP never calls the client. It sends the content to the tags over
    802.15.4 radio the next time each tag polls ([docs/protokoll.md](https://github.com/mathiasbk/openesl/blob/master/docs/protokoll.md), part 1).

    **Reaching the AP.** Over WiFi the client must be on the same network as the AP (or a
    VPN). Give the AP a fixed IP (DHCP reservation) or use the mDNS name `openesl.local`.
    The same API (the same code, `esl_api.c`) also answers on the AP's USB port as `@ESL`
    lines next to the log, with no token, for setups without WiFi
    ([ap/README.md](https://github.com/mathiasbk/openesl/blob/master/ap/README.md), "Over the USB port"). Over the USB port a body that stops arriving gives `408`.
    A read-only status page at `/` needs no token.

    **Trying it from this page.** A web page cannot open the AP's USB port or call a plain
    HTTP address, so start the bridge in the example client on the computer the AP is
    plugged into, and pick the `localhost` server here:

    ```
    python3 tools/esl-client/esl_client.py --serial /dev/ttyACM0 serve
    python3 tools/esl-client/esl_client.py --url http://openesl.local --token <token> serve
    ```

    It listens on `http://localhost:8080` and only answers pages from this site and from
    `localhost`. The browser may ask whether this page may reach devices on your network.

    **Authentication.** `Authorization: Bearer <token>` on every request. The token is set
    in the AP (the setup page at `/setup`, menuconfig or NVS). Without a valid token the reply is `401`, also when the
    AP has no token set. Plain HTTP on the local network or VPN; there is no HTTPS.

    **Requests.** Paths take an optional trailing `/`, and a query string is ignored.
    Bodies are JSON objects of at most 24,576 bytes and 1,024 JSON tokens (`413` above
    that; layout files have their own limit of 8,192 bytes). MACs are 16 hex digits, most
    significant byte first, upper or lower case.

    **Errors** come as `{"error":"<what is wrong>"}`, in a batch with `"index"` for the row:

    | Status | When |
    |---|---|
    | `400` | no body, invalid JSON, the body is not an object, a bad MAC in the path, a bad string escape |
    | `401` | missing or wrong token (also when the AP has no token set) |
    | `404` | unknown path, unknown tag on `GET`/`DELETE`, unknown model or no layout file, nothing scheduled to delete |
    | `405` | a method the path does not have |
    | `413` | the body is too large |
    | `422` | the JSON is valid but a value is not (the message says which) |
    | `500` | an error inside the AP (out of memory, a reply too large, a layout file that could not be stored) |
    | `409` | `at` is given but the AP does not know the time yet (`PUT /api/time`) |
    | `408` | over the USB port: a body that stops arriving |
    | `429` | five wrong tokens in a row: every request (also with the right token, also the `/setup` form) is refused for 60 s; not on the USB port |
    | `501` | OTA on a build or partition table without it |
    | `507` | the tag table or the schedule is full, or NVS has no room for the content |

    **Text** is sent as UTF-8. The AP converts it to Latin-1 (unknown characters become
    `?`) and rejects text that is too long with `422`: the fields share 96 bytes, one length
    byte per field plus the text after the conversion, so at most 92 bytes of text with four
    fields and 90 with six (`ESL_CONTENT_FIELD_SPACE` in `shared/proto.h`). Empty fields at
    the end are dropped first and cost nothing.

    **Which tag is which.** Every tag is known by its MAC. `GET /api/tags` gives each tag's
    `model` (`"2.9"` or `"1.54"`, from its poll). The 12 hex digits under the barcode on the
    label (e.g. `020663461013`) give the MAC without the AP: `0000`, the first 8 digits, the
    model code (`3B` for 2.9", `34` for 1.54"), then `1` and a check digit: the XOR of the
    11 hex digits between `0000` and it (so `0000020663463415`). The last 4
    digits of the label are not part of the MAC. A client that only knows the label can
    work out both candidates and use the one the AP knows. `esl_client.py mac 020663461013`
    does the same ([docs/tag-firmware.md](https://github.com/mathiasbk/openesl/blob/master/docs/tag-firmware.md), "Tag identity").

servers:
  - url: http://localhost:{port}
    description: The bridge in tools/esl-client (esl_client.py serve), to the AP over USB or WiFi
    variables:
      port:
        default: "8080"
  - url: http://{host}
    description: The AP directly over WiFi (from your own software; not reachable from this page)
    variables:
      host:
        default: openesl.local

security:
  - token: []

tags:
  - name: Content
    description: Put text on the tags and read what they show.
  - name: Schedule
    description: |
      Content that takes effect at a given time (`at` in `PUT /api/tags`): a new price from
      Monday, a sale that starts and ends. Kept in NVS, so it survives an AP restart, and
      set by the AP itself, so the client does not need to run at that time.
  - name: Settings
    description: How often the tags poll and when they give up on the AP. Kept in NVS, so they survive an AP restart.
  - name: Health
    description: |
      Which tags need attention: silent (no poll for 3 intervals), never seen since the AP
      started, drawing failed, battery low, layout file rejected, or content that cannot be
      sent. `GET /api/health` is made for monitoring (poll it, and read `ok`). With a
      `webhook` set in `PUT /api/config`, the AP checks every 30 s and `POST`s the same
      report (plus `changed`) to that URL whenever any tag's problems change, so nothing
      needs to poll it.
  - name: Firmware
    description: |
      New firmware for the AP itself over the API (`esl-client ota esl_ap.bin`). The image
      goes to the app slot that is not running, which becomes the boot slot; the AP restarts
      a second after the reply, and the bootloader goes back to the old slot if the new image
      does not come up. The AP's own tag content, settings and layout files stay (they are in
      NVS). The image is `esl_ap.bin` from a build, or `openesl-ap-esp32c6-<version>-ota.bin`
      from a release (not the merged flash image, which has the bootloader in front).
  - name: Tag firmware
    description: |
      New firmware for the tags, sent to them over the radio
      ([docs/tag-ota.md](https://github.com/mathiasbk/openesl/blob/master/docs/tag-ota.md)).
      The file is `openesl-tag-<model>-<version>-ota.bin` from a release (or `tag/build/fw/openesl-ota.bin`):
      a 16-byte header with the model, version, size and CRC-32, then the image. The AP keeps
      one image per model and offers it to every tag of that model that polls with another
      firmware version and can take updates (firmware with the bootloader and a SPI flash),
      after its settings and its content's image; the tag fetches it block by block over a
      few wake-ups, installs it and restarts. A tag that rejects the image, or goes back to
      its old firmware because the new one never reached the AP, is not offered it again.
      `esl-client tag-ota` uploads a file and shows how far the tags are.
  - name: WiFi
    description: |
      The network the AP joins. With no network saved the AP opens its own network
      `openesl-XXXX` with a form at `http://192.168.4.1/setup` (`/` redirects there) to pick
      the network and set the token; if the saved network gives no IP for 180 s
      (`ESL_WIFI_SETUP_AFTER_S`) the setup network opens again next to it, and it closes a
      minute after the AP has joined. Once a token is set, the form asks for it. Over the
      USB port these endpoints set up WiFi without a browser
      ([ap/README.md](https://github.com/mathiasbk/openesl/blob/master/ap/README.md), "WiFi setup").
  - name: Layout files
    description: |
      One layout file per tag model holds up to 16 named layouts, made with the Design tab
      of the web page or by hand. A client uploads it here and then names a layout in the
      content (`"layout": "shelf"`). The AP checks the file against the model's screen and
      what it can draw, so a file that is accepted always draws; the AP draws each tag's
      screen with it and sends the tag the image. The format is in the `LayoutFile` schema below and,
      with every rule, in [docs/protokoll.md](https://github.com/mathiasbk/openesl/blob/master/docs/protokoll.md) part 3.
      The built-in layouts `price` and `text` can always be used, with or without a file.
  - name: Data sources
    description: |
      Content the AP fetches for itself, so no client has to run: the weather forecast for a
      place from MET Norway, every 30 minutes or less often. Each source fills its fields from
      what it fetched (`{temp}°`, `{wind} m/s`) and gives them to its tags in its layout, as
      if a client had sent `PUT /api/tags`; a tag only gets new content when the text came out
      different. Content a client sends to a tag (`PUT /api/tags`, a picture) takes it out of
      its source, so the source does not overwrite it; a source left without tags goes. ESP32-S3 APs only (`ESL_DATASOURCES`); the others answer `404`. The AP needs
      to know the time and to reach the internet. How it works, every value and the weather
      template: [docs/data-sources.md](https://github.com/mathiasbk/openesl/blob/master/docs/data-sources.md).
      MET Norway's data is CC BY 4.0: show "MET Norway" where the forecast is shown (the weather
      template does).

paths:
  /api/tags:
    get:
      tags: [Content]
      operationId: listTags
      summary: Status for all tags
      description: |
        The AP and every tag it knows: tags with content and tags that have polled. Tags
        that have polled without any content set have `content_id: 0`; this is how a
        client finds new tags. The AP has no clock, so it gives "seconds ago".

        A client that reads the list often (Home Assistant) can ask for only the tags that
        changed: send `since` with any value the first time, then the `since` of the last
        reply. With `full: false` the reply holds only the tags whose row changed since
        then: a poll, new content, settings, a drawing, firmware; `seen_s_ago` going up by
        itself is no change, so keep counting it on the client. With `full: true` it holds
        every tag, and the client replaces its list: the first time, after the AP restarted,
        or when a tag was deleted. An AP firmware without it ignores `since` and sends
        the whole list, without `since` and `full`.
      parameters:
        - name: since
          in: query
          required: false
          schema: { type: string, example: "5eed0001-17" }
          description: The `since` of the last reply; any other value gets the whole list
      responses:
        "200":
          description: The AP and its tags
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TagList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/Locked" }
    put:
      tags: [Content]
      operationId: setTags
      summary: Set content for many tags
      description: |
        At most 50 tags per call (RAM on the AP). The batch is all or nothing: one invalid
        row gives `422` with `index` pointing at the row, and no tag is changed. Practical
        for the daily price job: send everything every time, and only what changed is drawn.
        Rows with `at` are scheduled (see `PUT /api/tags/{mac}`); the same MAC may be in the
        batch once per `at`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Batch" }
            examples:
              prices:
                summary: Two price labels
                value:
                  tags:
                    - { mac: "00000123456789A8", layout: price, fields: ["Semi-skimmed milk 1 L", "24.90", "NOK 24.90/L"], price_highlight: true }
                    - { mac: "00000123456789B2", layout: price, fields: ["Butter 500 g", "54.90", "NOK 109.80/kg"] }
              scheduled:
                summary: A sale from 13:00 to 14:00 UTC on 2026-10-15
                value:
                  tags:
                    - { mac: "00000123456789B2", layout: price, fields: ["Butter 500 g", "44.90", "Offer"], price_highlight: true, at: 1792069200 }
                    - { mac: "00000123456789B2", layout: price, fields: ["Butter 500 g", "54.90", "NOK 109.80/kg"], at: 1792072800 }
                    - { mac: "00000123456789C3", layout: price, fields: ["Cheese 1 kg", "99.00", "Offer"], at: 1792069200 }
      responses:
        "200":
          description: One line per tag, in the order sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BatchResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/Locked" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "422": { $ref: "#/components/responses/BatchInvalid" }
        "500": { $ref: "#/components/responses/ServerError" }
        "409": { $ref: "#/components/responses/NoTime" }
        "507": { $ref: "#/components/responses/TableFull" }

  /api/tags/{mac}:
    parameters:
      - $ref: "#/components/parameters/mac"
    get:
      tags: [Content]
      operationId: getTag
      summary: Status for one tag
      description: The same object as one line in `GET /api/tags`, plus the content when the tag has any.
      responses:
        "200":
          description: The tag
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TagDetail" }
        "400": { $ref: "#/components/responses/BadMac" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/Locked" }
        "404": { $ref: "#/components/responses/UnknownTag" }
    put:
      tags: [Content]
      operationId: setTag
      summary: Set content for one tag
      description: |
        An unknown MAC is accepted: the content is ready when the tag appears. The same
        content twice gives `changed: false`, and the tag does not draw again, so a client
        can send everything every time without tracking what has changed.

        With `at` (Unix seconds, UTC) in the future the content is scheduled instead: the
        AP keeps it and sets it at that time, as if it was sent then, also after a restart.
        The tag keeps its current content until then. A tag can have several scheduled
        entries (a sale and the price after it); the same `at` again replaces that entry.
        `at` in the past means now. Scheduling needs the AP to know the time (NTP over WiFi,
        or `PUT /api/time`), else `409`. If the AP restarts without NTP, entries wait until
        the time is set again; those that came due meanwhile are set then, the latest per
        tag. Content sent without `at` does not remove scheduled entries
        (`DELETE /api/schedule/{mac}` does). A tag that polls between scheduling and `at`
        is told to poll again 2 s after `at`, so the content shows within seconds of `at`
        whatever its interval: schedule at least one interval ahead.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Content" }
            examples:
              price:
                summary: Price label with a highlighted price
                value: { layout: price, fields: ["Semi-skimmed milk 1 L", "24.90", "NOK 24.90/L"], price_highlight: true }
              text:
                summary: Four lines of text in a frame
                value: { layout: text, fields: ["Welcome", "Open 9–21", "", ""], frame: true }
              named:
                summary: A layout from the layout file
                value: { layout: shelf, fields: ["Coffee 500 g", "49.90", "NOK 99.80/kg", "Offer"], price_highlight: true }
              two_prices:
                summary: Price inc. and ex. VAT (layout vare-priser, fields brand, name, info, price, price_ex)
                value: { layout: vare-priser, fields: ["Kramp", "Lower ball joint, cat. 3/2", "1626-160602/439", "192,25", "153,80"], price_highlight: true }
              scheduled:
                summary: A new price from 13:00 UTC on 2026-10-15
                value: { layout: price, fields: ["Semi-skimmed milk 1 L", "22.90", "NOK 22.90/L"], at: 1792069200 }
      responses:
        "200":
          description: Stored; the tag fetches it at its next poll. With a future `at`, scheduled.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/SetResult"
                  - $ref: "#/components/schemas/Scheduled"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/Locked" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "409": { $ref: "#/components/responses/NoTime" }
        "422": { $ref: "#/components/responses/Invalid" }
        "500": { $ref: "#/components/responses/ServerError" }
        "507": { $ref: "#/components/responses/TableFull" }
    delete:
      tags: [Content]
      operationId: deleteTag
      summary: Remove a tag from the AP
      description: |
        Removes its content, settings and scheduled content. The tag keeps what it shows
        until it gets new content; if it polls again it is added back without content.
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TagDeleted" }
        "400": { $ref: "#/components/responses/BadMac" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/Locked" }
        "404": { $ref: "#/components/responses/UnknownTag" }

  /api/schedule/{mac}:
    parameters:
      - $ref: "#/components/parameters/scheduled_mac"
    delete:
      tags: [Schedule]
      operationId: deleteTagSchedule
      summary: Remove a tag's scheduled content
      description: Every scheduled entry for the tag. Its current content stays.
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScheduleDeleted" }
        "400": { $ref: "#/components/responses/BadMac" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/Locked" }
        "404": { $ref: "#/components/responses/NothingScheduled" }

  /api/schedule:
    get:
      tags: [Schedule]
      operationId: listSchedule
      summary: All scheduled content
      description: Every entry that has not taken effect yet, with its content, in no particular order.
      responses:
        "200":
          description: The schedule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScheduleList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/Locked" }
    delete:
      tags: [Schedule]
      operationId: deleteSchedule
      summary: Remove all scheduled content
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScheduleDeleted" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/Locked" }
        "404": { $ref: "#/components/responses/NothingScheduled" }

  /api/time:
    get:
      tags: [Schedule]
      operationId: getTime
      summary: The AP's clock
      description: |
        The AP has no clock that survives a restart. It gets the time from NTP while it is
        on WiFi (`ESL_NTP_SERVER` in menuconfig), or from `PUT /api/time`. Only scheduled
        content uses it.
      responses:
        "200":
          description: The time, or null while it is not known
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Time" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/Locked" }
    put:
      tags: [Schedule]
      operationId: setTime
      summary: Set the AP's clock
      description: |
        For an AP without WiFi (over the USB port). NTP sets it again at its next sync.
        `esl_client.py` sets it before it schedules content if the AP does not know the time.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [time]
              properties:
                time: { type: integer, minimum: 1600000000, maximum: 4294967295, description: "Unix seconds, UTC" }
            examples:
              now:
                summary: 2026-10-15 12:00 UTC
                value: { time: 1792065600 }
      responses:
        "200":
          description: The time is set
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Time" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/Locked" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "422": { $ref: "#/components/responses/Invalid" }

  /api/tags/{mac}/image:
    parameters:
      - $ref: "#/components/parameters/mac"
    get:
      tags: [Tags]
      operationId: getTagImage
      summary: The screen the AP draws for a tag
      description: |
        The tag's content drawn by the AP, the bytes a tag that shows images gets
        (protokoll.md, "Image transfer"). A tag that draws itself shows the same pixels. Drawn
        on each request and not kept; for previews such as the dashboard.

        `data` is base64 of the raw image: the black plane, then the red plane when `red`
        is true. A plane is `width` columns from left to right, each `ceil(height / 8)`
        bytes, byte 0 bit 7 the top row; a set bit is ink.

        Content held back because a barcode, QR code or number does not fit its box
        (`content_error`) is drawn all the same, so the preview shows what is wrong; the tag
        does not get it.
      responses:
        "200":
          description: The image
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [mac, model, width, height, red, content_id, image_id, data]
                properties:
                  mac: { $ref: "#/components/schemas/Mac" }
                  model: { type: string, examples: ["2.9"] }
                  width: { type: integer, minimum: 1 }
                  height: { type: integer, minimum: 1 }
                  red: { type: boolean, description: The image has a red plane }
                  content_id: { type: integer, minimum: 0, maximum: 4294967295 }
                  image_id: { type: integer, minimum: 1, maximum: 4294967295, description: "CRC-32 of the image bytes (0 sent as 1): the `image_id` a tag that shows images reports once it shows it" }
                  data: { type: string, contentEncoding: base64 }
        "400": { $ref: "#/components/responses/BadMac" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/Locked" }
        "404":
          description: Unknown tag, a tag whose model is not known yet, or no content
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: The content names a layout that is not in the file (`content_error`), or cannot be drawn
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: No memory to draw the image
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    put:
      tags: [Content]
      operationId: setTagImage
      summary: Show a picture on a tag
      description: |
        A picture the client drew becomes the tag's content, for what a layout cannot show
        (a chart, a logo, a dashboard drawn in Home Assistant). Layouts stay the way for
        price labels: a picture costs about 5 KB of NVS per tag (less when it has large
        areas of one colour), a layout entry about 300 bytes.

        The body is a PNG of exactly the tag's screen size (`width` x `height` in
        `GET /api/tags/{mac}/image`, 296 x 128 for the 2.9"), any colour type and bit depth,
        not interlaced; transparency is laid over white. Each pixel becomes the nearest
        colour the tag has (white, black, and red on a model with red), or with
        `dither=true` the colours are mixed by error diffusion (Floyd–Steinberg), for
        photos and shades of grey. A 1-bit black and white PNG is shown as it is. The body
        may also be the raw image in the format `GET` gives (`data`, decoded from base64),
        of exactly that many bytes. Content-Type is not checked.

        The tag must have polled once, so its model is known. The picture is kept in NVS and
        shown like other content: `content_id` changes with the picture, the same picture
        again gives `changed: false`, and the tag gets it at its next poll. `GET
        /api/tags/{mac}` then has `layout: "image"` and no fields. Content set later (a
        layout, `PUT /api/tags`) replaces it, and the picture is erased. Pictures cannot be
        scheduled (`at`). Pictures leave 32 KB of NVS free for content, settings and layout
        files: past that a new picture gets 507.

        Over WiFi the PNG is decoded as it arrives, so it may be up to 512 KB; over the USB
        port a request body is at most 24,576 bytes.
      parameters:
        - name: dither
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: Mix the colours by error diffusion instead of taking the nearest one
      requestBody:
        required: true
        content:
          image/png:
            schema: { type: string, format: binary }
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Stored; the tag fetches it at its next poll
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SetResult" }
        "400":
          description: A bad MAC or `dither`, no body, a broken PNG (also one with data past its last row), a body that ended early, or a raw image with a pixel in both the black and the red plane
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/Locked" }
        "404": { $ref: "#/components/responses/UnknownTag" }
        "409":
          description: The tag's model is not known yet (it has not polled), or the tag was deleted or changed while the picture came in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415":
          description: Not a PNG (nor a raw image of the right size), an interlaced PNG, or one with a colour type, bit depth or critical chunk PNG does not have
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: The picture is not the size of the tag's screen; the message gives the size
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "501":
          description: This AP keeps no pictures
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: No memory to decode the picture (up to about 56 KB, 32 KB of it in one block)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "507":
          description: No room in NVS for the picture (32 KB is kept free for other content), or the tag table is full
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/tags/{mac}/config:
    parameters:
      - $ref: "#/components/parameters/mac"
    get:
      tags: [Settings]
      operationId: getTagConfig
      summary: Settings for one tag
      responses:
        "200":
          description: The tag's settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TagConfigReply" }
        "400": { $ref: "#/components/responses/BadMac" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/Locked" }
        "404": { $ref: "#/components/responses/UnknownTag" }
    put:
      tags: [Settings]
      operationId: setTagConfig
      summary: Change the settings for one tag
      description: |
        Replaces the tag's settings. A missing or `null` field means the default: `poll_s`
        falls back to the AP default (`PUT /api/config`), the others to the tag's built-in
        values. `{}` resets everything. A tag with its own settings is not replaced when the
        table is full, like a tag with content. An unknown MAC is accepted.

        With `poll_s` above 120 s new content can take longer than 2 minutes to show.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TagConfig" }
            examples:
              slower:
                summary: Poll every 2 minutes, back off to 15
                value: { poll_s: 120, max_poll_s: 900, lost_ap_s: null }
              reset:
                summary: Back to the defaults
                value: {}
      responses:
        "200":
          description: Stored; the tag gets it at its next poll
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TagConfigChanged" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/Locked" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "422": { $ref: "#/components/responses/Invalid" }
        "500": { $ref: "#/components/responses/ServerError" }
        "507": { $ref: "#/components/responses/TableFull" }

  /api/config:
    get:
      tags: [Settings]
      operationId: getApConfig
      summary: The AP-wide default poll interval, the webhook, the transmit power and the clock settings
      responses:
        "200":
          description: The default
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApConfigReply" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/Locked" }
    put:
      tags: [Settings]
      operationId: setApConfig
      summary: Change the AP-wide default poll interval, the webhook, the transmit power or the clock settings
      description: |
        `poll_s` is the interval for tags without their own `poll_s`; the tags get it in the
        reply to their next poll, so all of them have it within one old interval. Content
        scheduled with `at` still shows on time with a long interval. `webhook` is where the
        AP posts the health report (`GET /api/health`) when it changes. `tx_power` is the
        radio's 802.15.4 transmit power, used from its next reply (a radio over WiFi gets it
        at its next sync). `ntp` and `tz` set the AP's clock (NTP server and time zone). A key
        left out keeps its value; at least one must be there. All are stored in NVS
        (`cfg/poll_s`, `cfg/webhook`, `cfg/tx_dbm`, `cfg/ntp`, `cfg/tz`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApConfig" }
            examples:
              two-minutes:
                summary: Every 2 minutes
                value: { poll_s: 120 }
              builtin:
                summary: Back to the value set in menuconfig
                value: { poll_s: null }
              webhook:
                summary: Post the health report to a server when it changes
                value: { webhook: "http://192.168.1.10:8080/openesl" }
              no-webhook:
                summary: Stop posting
                value: { webhook: null }
              antenna:
                summary: An external antenna of 5 dBi, so 8 dBm keeps within the EU's ~13 dBm EIRP
                value: { tx_power: 8 }
              clock:
                summary: Norwegian time, from a Norwegian NTP server
                value: { ntp: "no.pool.ntp.org", tz: "CET-1CEST,M3.5.0,M10.5.0/3" }
      responses:
        "200":
          description: The new default
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApConfigReply" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/Locked" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "422": { $ref: "#/components/responses/Invalid" }

  /api/health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: The tags that need attention
      description: |
        Every tag with a problem, and counts per problem. A tag is `silent` when it has not
        polled for `silent_s` (default 3 x its interval), `unseen` when it is in the table
        from NVS but has not polled since the AP started for that long, `low_battery` below
        `battery_mv` (a tag that reports 0 cannot measure it, and is never low).
      parameters:
        - name: silent_s
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 65535 }
          description: Seconds without a poll before a tag is silent (default 3 x the interval the AP sends it; 180 s for a tag on the built-in 60 s)
        - name: battery_mv
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 65535 }
          description: Battery voltage below which a tag is low (default 2500)
      responses:
        "200":
          description: The health report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/Locked" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/ota:
    get:
      tags: [Firmware]
      operationId: getOta
      summary: Which app slot runs, what the other holds, and what the AP's radio coprocessor runs
      x-host-status: 501
      responses:
        "200":
          description: The app slots
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OtaInfo" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/Locked" }
        "501": { $ref: "#/components/responses/NoOta" }
    post:
      tags: [Firmware]
      operationId: postOta
      summary: Write new AP firmware and restart into it, or pass new firmware on to the radio coprocessor
      description: |
        The body is the app image, whole in one request (no query), or in parts with
        `offset` and `total`: a part at offset 0 starts a new upload, every other part must
        start where the last one ended (otherwise `409` says which offset is expected, and
        the upload stays open so the part can be sent again). The USB port takes parts of at
        most 24,576 bytes (`esl-client` sends 16 KB), since its driver drops bytes when its
        buffer is full; over WiFi one request is fine. The last byte makes the new slot the
        boot slot; the reply names it and its version, and the AP restarts one second later.
        The new firmware is kept once it can be reached (`confirmed` in `GET /api/ota`);
        otherwise the AP goes back to the old one after three minutes.

        On an AP with a C6 radio on UART (`radio` in `GET /api/ota`), the radio
        coprocessor's image (`openesl-ap-radio-*-ota.bin`, project `esl_radio`) is taken the
        same way: the AP passes each part on to the radio over the cable before it answers,
        and after the last part the radio restarts into it (`radio: true` in the reply; the AP
        keeps running). The radio keeps the new firmware once the AP configures it, and goes
        back to the old one by itself if that does not happen within a minute; `radio.version`
        in `GET /api/ota` says what it runs. A radio from before 0.8.2 (`radio.ota` false)
        takes new firmware only over USB.
        Content-Type is not checked.
      x-host-status: 501
      parameters:
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0 }
          description: Where in the image this part starts (with `total`)
        - name: total
          in: query
          required: false
          schema: { type: integer, minimum: 1 }
          description: The size of the whole image (with `offset`)
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: The part is written; `restarting` is in the reply when it was the last one, `radio` when it was for the radio coprocessor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OtaReply" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/Locked" }
        "409":
          description: Not the next part (`expected offset N of T`), or no upload in progress for an offset above 0
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: expected offset 32768 of 1048576 }
        "413":
          description: The image does not fit the app slot (`slot_size` in `GET /api/ota`), or the parts add up to more than `total`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: the image does not fit the app slot }
        "422":
          description: An empty body, `offset` without `total` or the other way round, an image that is not an app image for this chip, an app that is not the AP firmware (another project name in its app description), or the radio coprocessor's `esl_radio` on an AP without a radio on UART
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: the image is not valid for this chip }
        "500": { $ref: "#/components/responses/ServerError" }
        "501": { $ref: "#/components/responses/NoOta" }
        "503":
          description: The radio coprocessor's image, and the radio does not answer the AP
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "the radio is not answering on UART1: check the wiring (TX GPIO17, RX GPIO18)" }
        "504":
          description: The radio coprocessor stopped answering in the middle of its image
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: the radio stopped answering }

  /api/tag-firmware:
    get:
      tags: [Tag firmware]
      operationId: listTagFirmware
      summary: The tag firmware of each model, and how far the tags are
      responses:
        "200":
          description: One line per model, with or without an image
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TagFirmwareList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/Locked" }
    put:
      tags: [Tag firmware]
      operationId: putTagFirmware
      summary: Upload tag firmware; the AP offers it to the tags of its model, or to one of them
      description: |
        The body is the file, whole in one request (no query), or in parts with `offset` and
        `total`, as for `POST /api/ota`: a part at offset 0 starts a new upload (the model is
        taken from the header in it), every other part must start where the last one ended.
        A part may have at most 24,576 bytes (`part_max`), so an image (about 54 KB) goes in
        parts; `esl-client` and the dashboard send 8 KB. The AP writes a part to its store in
        2 KB pieces as it arrives, so the size of a part costs it no RAM (over WiFi it takes
        bigger parts too, but on the USB port keep to `part_max`). A part sent again after its
        connection dropped is taken: the bytes the AP already has are skipped. From the first part on, the model's old image is no
        longer offered; after the last one the AP checks the CRC-32 and offers the new one.
        With `to` set to a tag's MAC (read with the part at offset 0), it is offered to that
        tag alone; `POST /api/tag-firmware/{model}` gives it to more. Without `to`, or with
        `to=all`, every tag of the model gets it. Content-Type is not checked.
      parameters:
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0 }
          description: Where in the file this part starts (with `total`)
        - name: total
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 61456 }
          description: The size of the whole file (with `offset`)
        - $ref: "#/components/parameters/fw_to"
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: The part is stored; after the last one, the image the AP now offers
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TagFirmwareReply" }
        "400":
          description: No body, `offset` without `total` or the other way round, a first part shorter than the header, `total` not the size in the header, or a `to` that is neither `all` nor a MAC
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: total does not match the size in the file header }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/Locked" }
        "409":
          description: Not the next part, or no upload in progress for an offset above 0
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: not the next part of the upload in progress }
        "413":
          description: The file is larger than a tag image can be, or the parts add up to more than `total`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: the file is larger than a tag image can be }
        "422":
          description: Not a tag firmware file, an unknown model, a bad size or version in the header, or an image that does not match its CRC-32
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: not a tag firmware file (openesl-ota.bin from the release) }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/tag-firmware/{model}:
    parameters:
      - $ref: "#/components/parameters/model"
    get:
      tags: [Tag firmware]
      operationId: getTagFirmware
      summary: The tag firmware for a model, and how far its tags are
      responses:
        "200":
          description: The image
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TagFirmware" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/Locked" }
        "404": { $ref: "#/components/responses/NoTagFirmware" }
    post:
      tags: [Tag firmware]
      operationId: chooseTagFirmware
      summary: Offer the model's image to one more tag, or to all of them
      description: |
        `to` is a tag's MAC, added to the tags the image is for (`to` in the reply), or `all`.
        At most 16 tags can be chosen one by one; after that only `all` is taken. The choice is
        kept across a restart, and a new upload starts it again.
      parameters:
        - $ref: "#/components/parameters/fw_to"
      responses:
        "200":
          description: The image, and who it is for now
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TagFirmware" }
        "400":
          description: No `to`, or one that is neither `all` nor a MAC
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "give to=all or to= a tag's MAC (16 hex digits)" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/Locked" }
        "404": { $ref: "#/components/responses/NoTagFirmware" }
        "409":
          description: 16 tags are chosen one by one already
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "too many tags chosen one by one: give it to all of them (to=all)" }
    delete:
      tags: [Tag firmware]
      operationId: deleteTagFirmware
      summary: Stop updating the tags of a model
      description: Tags in the middle of a download stop at their next request; what they already installed stays.
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LayoutDeleted" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/Locked" }
        "404": { $ref: "#/components/responses/NoTagFirmware" }

  /api/wifi:
    get:
      tags: [WiFi]
      operationId: getWifi
      summary: The WiFi state and the last scan
      responses:
        "200":
          description: The WiFi state; never the password
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WifiStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/Locked" }
    put:
      tags: [WiFi]
      operationId: setWifi
      summary: Set the network the AP joins, and the API token
      description: |
        Stored in NVS (`cfg/ssid`, `cfg/pass`). The AP leaves the old network and joins the
        new one at once, so a `PUT` over WiFi may lose its own connection before the reply
        arrives; over the USB port it always arrives. `ssid` `""` or `null` forgets the saved
        network, and the AP opens its setup network.

        `token` sets a new API token (NVS `cfg/token`), which every later HTTP request must
        carry. The web page sets the network and the token this way over the USB port right
        after flashing. `hostname` is the AP's name on the network: what it tells the router
        (DHCP) and its mDNS name (`<hostname>.local`); stored in NVS (`cfg/hostname`), and the
        AP rejoins at once so the router hears it. With a token or a hostname, `ssid` may be
        left out to keep the network. Anything invalid saves nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WifiSet" }
            examples:
              wpa2:
                summary: A WPA2 network
                value: { ssid: Butikken, password: hemmelig123 }
              open:
                summary: An open network
                value: { ssid: Gjest }
              forget:
                summary: Forget the network and open the setup network
                value: { ssid: null }
              with_token:
                summary: The network and a new API token at once
                value: { ssid: Butikken, password: hemmelig123, token: lang-hemmelig-token }
              token_only:
                summary: Only a new API token; the network stays
                value: { token: lang-hemmelig-token }
              hostname:
                summary: A new name on the network (butikk.local)
                value: { hostname: butikk }
      responses:
        "200":
          description: The WiFi state after the change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WifiStatus" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/Locked" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "422": { $ref: "#/components/responses/Invalid" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/layouts:
    get:
      tags: [Layout files]
      operationId: listLayouts
      summary: The layout file of each model
      responses:
        "200":
          description: One line per model, with or without a file
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LayoutList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/Locked" }

  /api/layouts/{model}:
    parameters:
      - $ref: "#/components/parameters/model"
    get:
      tags: [Layout files]
      operationId: getLayoutFile
      summary: The layout file, as uploaded
      responses:
        "200":
          description: The file
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LayoutFile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/Locked" }
        "404": { $ref: "#/components/responses/NoLayout" }
    put:
      tags: [Layout files]
      operationId: putLayoutFile
      summary: Upload the layout file for a model
      description: |
        The file is checked against the model in the URL, stored in NVS and compiled again
        at boot. The AP draws the screens of that model's tags with it, and each tag gets its
        new image at its next poll. The same file again
        gives `changed: false` and no NVS write.

        The content the tags of that model already have is checked against the new file, as
        `PUT /api/tags` checks new content. A tag whose barcode, QR code or number no longer
        fits its box is listed in `content_errors`, and its content is held back (it keeps
        what it shows, with `content_error` in `GET /api/tags`) until it gets content that
        fits or a file that fits it is uploaded. The AP does the same check at boot, and at a
        tag's next poll (or before its image is drawn) for content it did not check against this file yet (scheduled content
        that takes effect later, or content set before the tag's model was known).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LayoutFile" }
            examples:
              sign:
                summary: One layout with a heading and a body
                value:
                  format: esl-layouts
                  version: 1
                  model: "2.9"
                  layouts:
                    - name: sign
                      fields: [title, body]
                      elements:
                        - { type: text, field: title, x: 8, y: 4, w: 280, h: 30, fonts: [medium, small], align: center, valign: middle, lines: 1 }
                        - { type: rect, x: 8, y: 36, w: 280, h: 2 }
                        - { type: text, field: body, x: 8, y: 42, w: 280, h: 80, fonts: [medium, small], align: center, valign: middle, lines: 3 }
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LayoutStored" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/Locked" }
        "404": { $ref: "#/components/responses/UnknownModel" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "422": { $ref: "#/components/responses/LayoutInvalid" }
        "500": { $ref: "#/components/responses/ServerError" }
    delete:
      tags: [Layout files]
      operationId: deleteLayoutFile
      summary: Remove the layout file for a model
      description: The tags of that model drop their file at the next poll.
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LayoutDeleted" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/Locked" }
        "404": { $ref: "#/components/responses/NoLayout" }

  /api/sources:
    get:
      tags: [Data sources]
      operationId: getSources
      summary: The data sources and how their last fetch went
      description: |
        Each source as `PUT` takes it (every key filled in), with its `status`; `types` lists
        what each type of source gives: its values and the field templates it uses when a
        source gives none.
      responses:
        "200":
          description: The sources
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SourcesReply" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/Locked" }
    put:
      tags: [Data sources]
      operationId: setSources
      summary: Replace the data sources
      description: |
        The whole list, at most 8 sources of up to 32 tags each (a tag in one source only);
        `[]` removes them all. Stored in NVS (`cfg/sources`, at most 16,384 bytes as the AP
        writes it). A new or changed source is fetched at once; a source whose `id`, `type`,
        `lat` and `lon` stay the same keeps its last answer, and only its tags' content is
        made again (so changing the layout or the fields does not ask MET again). A source's
        `status` may be sent back as it came from `GET`; it is ignored. Tags no longer in a
        source keep what they show until they get other content.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SourcesConfig" }
            examples:
              oslo:
                summary: The weather in Oslo on two tags, in the weather layout
                value:
                  sources:
                    - id: home
                      type: met
                      lat: 59.9139
                      lon: 10.7522
                      place: Oslo
                      layout: weather
                      tags: ["00000123456789A8", "00000123456789B2"]
              own-fields:
                summary: Hourly, in English, on the built-in text layout (four lines)
                value:
                  sources:
                    - id: cabin
                      type: met
                      lat: 61.1153
                      lon: 10.4662
                      place: Lillehammer
                      lang: en
                      every_min: 60
                      layout: text
                      fields: ["{place} {temp}°", "{desc}", "{min}° to {max}°", "Tomorrow {tmin}°/{tmax}°"]
                      tags: ["00000123456789A8"]
              none:
                summary: No data sources
                value: { sources: [] }
      responses:
        "200":
          description: Saved; the sources as `GET` shows them
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SourcesReply" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/Locked" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "422": { $ref: "#/components/responses/SourcesInvalid" }
        "507": { $ref: "#/components/responses/SourcesNoRoom" }

  /api/sources/refresh:
    post:
      tags: [Data sources]
      operationId: refreshSources
      summary: Fetch every source now
      description: |
        Every source is fetched at once, except one whose last answer has not expired yet
        (MET's `Expires`, which MET's terms ask clients to respect): its tags' content is made
        again from that answer. The reply comes before the fetches are done; `GET` shows
        how they went. No body.
      responses:
        "202":
          description: The fetches have started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SourcesRefresh" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/Locked" }

components:
  securitySchemes:
    token:
      type: http
      scheme: bearer
      description: The token set in the AP. Not needed over the USB port. After five wrong tokens in a row the API answers `429` for 60 seconds.

  parameters:
    mac:
      name: mac
      in: path
      required: true
      description: The tag's MAC, 16 hex digits, most significant byte first
      schema: { type: string, pattern: "^[0-9A-Fa-f]{16}$" }
      example: "00000123456789A8"
    fw_to:
      name: to
      in: query
      required: false
      description: "`all`, or the MAC of the tag the image is for (16 hex digits)"
      schema: { type: string, pattern: "^(all|[0-9A-Fa-f]{16})$" }
      example: "00000123456789A8"
    scheduled_mac:
      name: mac
      in: path
      required: true
      description: The tag's MAC, 16 hex digits
      schema: { type: string, pattern: "^[0-9A-Fa-f]{16}$" }
      example: "00000123456789B2"
    model:
      name: model
      in: path
      required: true
      description: The tag model
      schema: { type: string, enum: ["2.9", "1.54"] }
      example: "2.9"

  responses:
    BadRequest:
      description: No body, invalid JSON, the body is not an object, or a bad string escape
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: invalid JSON }
    BadMac:
      description: The MAC in the path is not 16 hex digits
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: mac must be 16 hex digits }
    Unauthorized:
      description: Missing or wrong token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: unauthorized }
    Locked:
      description: |
        Five wrong tokens in a row lock the API for 60 seconds: every request gets this,
        whatever its token, and the count starts again afterwards. The USB port is not
        affected.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: "too many wrong tokens: locked for 42 s" }
    UnknownTag:
      description: The AP does not know this tag
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: unknown tag }
    UnknownModel:
      description: Not a tag model
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: unknown model (use 2.9 or 1.54) }
    NoTagFirmware:
      description: Not a tag model, or no firmware for it
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: no tag firmware for this model }
    NoLayout:
      description: Not a tag model, or no layout file for it
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: no layout for this model }
    TooLarge:
      description: The body is too large (24,576 bytes, a layout file 8,192)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: body too large }
    Invalid:
      description: The JSON is valid but a value is not; the message says which
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: "text too long: the fields share 96 bytes, one per field plus the text after Latin-1 conversion (92 bytes of text with four fields, 90 with six)" }
    BatchInvalid:
      description: A row is not valid; `index` is the row, and no tag was changed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: layout price takes at most 3 fields, index: 1 }
    LayoutInvalid:
      description: The file does not work on this model; the message says where and why
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: "layouts[0].elements[2]: x + w = 300 is past the right edge of the screen (296)" }
    ServerError:
      description: An error inside the AP (out of memory, a reply too large, a file that could not be stored)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: out of memory }
    TableFull:
      description: The tag table is full (`max_tags` in `GET /api/tags`, or no RAM left for more tags), NVS has no room to save the content (`no room to save it (NVS full)`; the tag keeps what it had), or with `at` the schedule (`max_scheduled`)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: tag table full }
    NoTime:
      description: "`at` is given, but the AP does not know the time yet"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: "the AP does not know the time yet: set it with PUT /api/time, or let it reach an NTP server" }
    NothingScheduled:
      description: There was nothing scheduled to remove
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: nothing scheduled }
    NoOta:
      description: This build has no OTA (`ESL_OTA` off, or the partition table has one app slot)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: no OTA on this transport or build }
    SourcesInvalid:
      description: A source is not valid; the message says which and why
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: "sources[0].fields[1]: {temperature} is not a value of type met" }
    SourcesNoRoom:
      description: NVS has no room to save the sources; the old ones stay
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: "no room to save it (NVS full)" }

  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: { type: string, description: What is wrong }
        index: { type: integer, minimum: 0, description: "In a batch: the row" }

    Mac:
      type: string
      pattern: "^[0-9A-F]{16}$"
      description: 16 hex digits, most significant byte first
      example: "00000123456789A8"

    Content:
      type: object
      required: [layout, fields]
      properties:
        layout:
          type: string
          description: |
            `price` (name, price, subtitle), `text` (up to 4 lines), or the name of a layout
            in a layout file, e.g. `shelf`. A named layout must be in the file for the tag's
            model (in any model's file while the model is not known yet); else `422`. The same name may be
            used in both models' files, so one body works for every tag.
          examples: [price, text, shelf]
        fields:
          type: array
          items: { type: [string, "null"] }
          description: |
            The text, in the layout's field order; `null` counts as `""`. `price` takes at
            most 3 fields, `text` at most 4, a named layout as many as its `fields` (up to 6).
            The fields share 96 bytes: the text after the conversion to Latin-1 plus one byte
            per field (92 bytes of text with four fields, 90 with six). Empty fields at the end
            are dropped, so `["a",""]` and `["a"]` are the same content. The AP sends the text
            as it is and works nothing out: for the price with and without VAT, use a layout
            with a field for each (e.g. `vare-priser`) and send both.
            A number formatted by the layout (`decimals`, `thousands`) that fits in none of
            its element's fonts gives `422`, since a price cut short would be a wrong one.
        price_highlight:
          type: [boolean, "null"]
          default: false
          description: White digits in a filled black box (`price`), or the `highlight` elements of a named layout.
        frame:
          type: [boolean, "null"]
          default: false
          description: A black frame around the screen (`frame` elements of a named layout). The tags are black and white only.
        at:
          type: [integer, "null"]
          minimum: 1600000000
          maximum: 4294967295
          description: |
            When the content takes effect, Unix seconds (UTC). Missing, null or in the past: now.
            The AP needs to know the time (`GET /api/time`), else `409`.
          example: 1792069200

    BatchRow:
      allOf:
        - type: object
          required: [mac]
          properties:
            mac: { type: string, pattern: "^[0-9A-Fa-f]{16}$", description: The tag's MAC }
        - $ref: "#/components/schemas/Content"

    Batch:
      type: object
      required: [tags]
      properties:
        tags:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/BatchRow" }

    SetResult:
      type: object
      additionalProperties: false
      required: [mac, content_id, changed, pending]
      properties:
        mac: { $ref: "#/components/schemas/Mac" }
        content_id:
          type: integer
          minimum: 1
          maximum: 4294967295
          description: |
            CRC-32 of layout, fields and flags, calculated by the AP. For a named layout it
            covers the name, not the layout number, so it is the same on both models.
          example: 2914470401
        changed: { type: boolean, description: "false: the tag already has this content and does not draw again" }
        pending: { type: boolean, description: "true: the tag has not fetched it yet" }

    BatchResult:
      type: object
      additionalProperties: false
      required: [tags]
      properties:
        tags:
          type: array
          items:
            oneOf:
              - $ref: "#/components/schemas/SetResult"
              - $ref: "#/components/schemas/Scheduled"
              - type: object
                description: The table filled up during the batch (only when the same MAC ends up in two slots, or there was no RAM for more tags; rare), or NVS had no room for its content
                additionalProperties: false
                required: [mac, error]
                properties:
                  mac: { $ref: "#/components/schemas/Mac" }
                  error: { type: string, enum: [tag table full, schedule full, no room to save it (NVS full)] }

    Scheduled:
      type: object
      additionalProperties: false
      required: [mac, scheduled, at]
      description: The content is kept and set at `at`
      properties:
        mac: { $ref: "#/components/schemas/Mac" }
        scheduled: { const: true }
        at: { type: integer, minimum: 1600000000, maximum: 4294967295, description: "Unix seconds, UTC" }

    Time:
      type: object
      additionalProperties: false
      required: [time, source]
      properties:
        time: { type: [integer, "null"], minimum: 1600000000, maximum: 4294967295, description: "Unix seconds, UTC; null: not known (no NTP and no PUT /api/time since the AP started)" }
        source: { type: [string, "null"], enum: [ntp, api, null], description: Where the time came from }

    ScheduleEntry:
      allOf:
        - type: object
          required: [mac, at]
          properties:
            mac: { $ref: "#/components/schemas/Mac" }
            at: { type: integer, minimum: 1600000000, maximum: 4294967295, description: "When it takes effect, Unix seconds, UTC" }
            layout: { type: string }
            fields: { type: array, items: { type: string } }
            price_highlight: { type: boolean }
            frame: { type: boolean }
      unevaluatedProperties: false

    ScheduleList:
      type: object
      additionalProperties: false
      required: [time, max_scheduled, scheduled]
      properties:
        time: { type: [integer, "null"], minimum: 1600000000, maximum: 4294967295, description: "The AP's time, as in GET /api/time" }
        max_scheduled: { type: integer, minimum: 1, description: "Room for entries (menuconfig ESL_MAX_SCHEDULED, default 256)" }
        scheduled:
          type: array
          items: { $ref: "#/components/schemas/ScheduleEntry" }

    ScheduleDeleted:
      type: object
      additionalProperties: false
      required: [deleted]
      properties:
        deleted: { type: integer, minimum: 1, description: How many entries were removed }

    ApInfo:
      type: object
      additionalProperties: false
      required: [fw, uptime_s, channel, max_tags, table_full, poll_s]
      properties:
        fw: { type: string, description: AP firmware version, example: "0.1.0" }
        board: { type: string, description: "The AP board the firmware was built for (`ap/boards/<board>/`), as `board` in `GET /api/layouts`; not sent by firmware 0.6.0 and older", example: s3-n16r8-c6 }
        board_name: { type: string, description: "The board's short name for people (`name` in its board.json); not sent by firmware 0.6.0 and older", example: ESP32-S3 + C6 on cable }
        uptime_s: { type: integer, minimum: 0, description: Seconds since the AP started }
        radio:
          type: object
          description: "The network radio (ESP32-C6 over WiFi, docs/ap-netradio.md); not sent by an AP that has none"
          required: [connected]
          properties:
            connected: { type: boolean, description: "A radio is connected now" }
            ip: { type: string, description: "Its address (only while connected)", example: "192.168.3.249" }
            seen_s: { type: integer, minimum: 0, description: "Seconds since it last sent anything (only while connected)" }
            fw: { type: integer, minimum: 0, description: "Its firmware version as a number, as in its HELLO (0 before HELLO; only while connected)" }
        replies:
          type: object
          additionalProperties: false
          description: "How the AP's own radio has answered the tags since it started (`esl_link_stats_t`); not sent by an AP with a network radio, nor by firmware 0.8.0 and older. A reply should be on its way within 5 ms of the request (requirement A3): a tag listens for 20 ms, so `slow` replies may not have reached it"
          required: [polls, blocks, tx_failed, dropped, slow, worst_us]
          properties:
            polls: { type: integer, minimum: 0, description: POLLs answered }
            blocks: { type: integer, minimum: 0, description: "FW_REQ and IMG_REQ answered" }
            tx_failed: { type: integer, minimum: 0, description: "Replies the radio could not send" }
            dropped: { type: integer, minimum: 0, description: "Frames lost before the radio task saw them (its queue was full)" }
            slow: { type: integer, minimum: 0, description: "Replies on their way more than 5 ms after the request" }
            worst_us: { type: integer, minimum: 0, description: "The longest time from a request to its reply, in microseconds" }
        channel: { type: integer, minimum: 11, maximum: 26, description: 802.15.4 channel }
        max_tags: { type: integer, minimum: 1, description: "The most tags the AP keeps (menuconfig, default 1000); the C6 may run out of RAM before" }
        table_full: { type: boolean, description: "A new tag found no room since a tag last got a slot (none free, and no RAM for more or max_tags reached): it is not listed until a slot frees" }
        poll_s:
          type: integer
          minimum: 0
          maximum: 3600
          description: The AP-wide default interval (`GET /api/config`); 0 = tags keep their built-in interval
        reset:
          type: string
          enum: [poweron, ext, sw, usb, panic, int_wdt, task_wdt, wdt, deepsleep, brownout, jtag, pwr_glitch, cpu_lockup, unknown]
          description: Why the AP last started. `task_wdt` means a stuck AP task was restarted by the watchdog.
        time: { type: [integer, "null"], minimum: 1600000000, maximum: 4294967295, description: "The AP's time (GET /api/time); left out when scheduling is off" }
        scheduled: { type: integer, minimum: 0, description: Scheduled entries waiting }
        max_scheduled: { type: integer, minimum: 1, description: "Room for scheduled entries; left out when scheduling is off" }

    TagCfg:
      type: object
      additionalProperties: false
      required: [poll_s, max_poll_s, lost_ap_s, long_poll_s, long_after_min]
      description: The tag's own settings; `null` = the default
      properties:
        poll_s: { type: [integer, "null"], minimum: 10, maximum: 3600, description: Poll interval in seconds }
        max_poll_s: { type: [integer, "null"], minimum: 10, maximum: 3600, description: Longest interval when the tag backs off }
        lost_ap_s: { type: [integer, "null"], minimum: 60, maximum: 65535, description: 'Seconds without the AP before the tag shows "No AP found"; 65535 = never' }
        long_poll_s: { type: [integer, "null"], minimum: 60, maximum: 65535, description: "Interval once the AP has been gone for long_after_min (built in: 3600)" }
        long_after_min: { type: [integer, "null"], minimum: 10, maximum: 65535, description: "Minutes without the AP before the tag polls only every long_poll_s; 65535 = never (built in: 1440, a day)" }

    TagFields:
      type: object
      required: [mac, seen_s_ago, battery_mv, rssi, fw, model, draw_failed, content_id, shown_content_id, pending,
                 poll_s, config, config_pending, content_error, ota, signal,
                 image, image_id, shown_image_id, fw_update]
      properties:
        mac: { $ref: "#/components/schemas/Mac" }
        seen_s_ago: { type: [integer, "null"], minimum: 0, description: "Seconds since the last poll. For a tag not heard since the AP started, counted from the time of its last poll before the restart (kept in NVS) once the AP knows the time; null when that is not known" }
        battery_mv: { type: [integer, "null"], minimum: 0, description: "Battery voltage; 0 = the tag cannot measure it (the 1.54\")" }
        rssi: { type: [integer, "null"], description: "Signal strength of the last poll, dBm" }
        fw: { type: [integer, "null"], minimum: 0, description: "The tag firmware version, fw_ver from its poll (100 = 0.1.0)" }
        model: { type: [string, "null"], enum: ["2.9", "1.54", null], description: "null until the tag has polled, and for firmware that does not send it" }
        draw_failed: { type: boolean, description: The tag said in its last poll that its last drawing failed }
        content_id: { type: integer, minimum: 0, maximum: 4294967295, description: "The content set for the tag; 0: none (a new tag)" }
        shown_content_id: { type: [integer, "null"], minimum: 0, maximum: 4294967295, description: "The content whose image the tag reported in its last poll, 0 for another image (see `image`); null: not seen since the AP started" }
        pending: { type: boolean, description: "The tag does not show `content_id` yet" }
        poll_s: { type: [integer, "null"], minimum: 0, maximum: 3600, description: "The interval the AP sends this tag; null: the tag's built-in one" }
        config: { $ref: "#/components/schemas/TagCfg" }
        config_pending: { type: boolean, description: A tag that understands settings has not confirmed the current ones (always false for older firmware) }
        content_error:
          type: [string, "null"]
          description: "Why the content is held back: it gets no new image until this is gone. Also while the tag still shows an image of it drawn before, when a newer layout file does not fit it or lacks its layout"
          enum:
            - the tag cannot show images drawn by the AP (old firmware, or no SPI flash)
            - the layout is not in the layout file for this tag's model
            - a barcode, QR code or number does not fit its box in the layout file for this tag's model
            - null
        ota: { type: boolean, description: "The tag takes new firmware over the radio (its last poll said so; `GET /api/tag-firmware` has the images)" }
        signal:
          description: "The tag's last polls, oldest first (8 on an AP without PSRAM, 32 with), and totals since the AP started. RAM only: null for a tag not heard since the AP started"
          oneOf:
            - { type: "null" }
            - type: object
              additionalProperties: false
              required: [rssi, lost, retry, polls, lost_total, retries, tag_rssi, tag_lqi]
              properties:
                rssi: { type: array, items: { type: integer, minimum: -128, maximum: 127 }, description: "The AP's signal strength of each poll, dBm" }
                lost: { type: array, items: { type: integer, minimum: 0, maximum: 127 }, description: "Polls the tag sent without an answer before each one (127 = 127 or more)" }
                retry: { type: array, items: { type: integer, enum: [0, 1] }, description: "1: the poll was the tag's second try, so the AP's answer to its first was lost" }
                polls: { type: integer, minimum: 0, maximum: 4294967295, description: Polls since the AP started }
                lost_total: { type: integer, minimum: 0, maximum: 65535, description: "Polls without an answer since the AP started, as the tags report them (stops at 65535)" }
                retries: { type: integer, minimum: 0, maximum: 65535, description: "Polls answered only at the second try since the AP started (stops at 65535)" }
                tag_rssi: { type: [integer, "null"], minimum: 0, maximum: 255, description: "The tag radio's raw RSSI byte for the AP's last answer; not in dBm (the scale is not measured yet), higher is stronger. null: firmware that does not send it" }
                tag_lqi: { type: [integer, "null"], minimum: 0, maximum: 127, description: "Link quality of the AP's last answer at the tag; null as tag_rssi" }
        image: { type: boolean, description: "The tag shows images the AP draws (its last poll said so; a tag without SPI flash cannot): `shown_content_id` is `content_id` once it shows that content's image, 0 while it shows another" }
        image_id: { type: [integer, "null"], minimum: 0, maximum: 4294967295, description: "The id (CRC-32) of the image of the tag's content, once the AP has drawn it for a tag; 0 until then, null without content. A tag with `image` shows `content_id` when it reports this id" }
        shown_image_id: { type: [integer, "null"], minimum: 0, maximum: 4294967295, description: "The image id a tag with `image` reported in its last poll (0 = nothing shown), null for other tags. `shown_content_id` is `content_id` when it is this tag's `image_id`, and 0 otherwise" }
        fw_update:
          description: "The AP's firmware for its model, which the tag takes and is for it: how many bytes it has fetched (the AP has sent up to there). null when it runs it, cannot take it, rejected it, or it is not for it. Kept in RAM only, so 0 again after a restart until its next block"
          oneOf:
            - { type: "null" }
            - type: object
              additionalProperties: false
              required: [version, received, size]
              properties:
                version: { type: string }
                received: { type: integer, minimum: 0 }
                size: { type: integer, minimum: 1024 }

    Tag:
      allOf: [{ $ref: "#/components/schemas/TagFields" }]
      unevaluatedProperties: false

    TagDetail:
      description: A tag, plus its content when it has any
      allOf:
        - $ref: "#/components/schemas/TagFields"
        - type: object
          properties:
            layout: { type: string, description: "The layout of the content, `image` for a picture (`PUT /api/tags/{mac}/image`)" }
            fields:
              type: array
              items: { type: string }
              description: The text as stored (after the conversion to Latin-1, without empty fields at the end)
            price_highlight: { type: boolean }
            frame: { type: boolean }
            scheduled:
              type: array
              items: { type: integer, minimum: 1600000000, maximum: 4294967295 }
              description: When the tag's scheduled content takes effect, Unix seconds (`GET /api/schedule` has the content)
      unevaluatedProperties: false

    TagList:
      type: object
      additionalProperties: false
      required: [ap, tags]
      properties:
        ap: { $ref: "#/components/schemas/ApInfo" }
        since:
          type: string
          pattern: "^[0-9a-f]{8}-[0-9]+$"
          description: Only with `?since=`. What to send as `since` next time
        full:
          type: boolean
          description: Only with `?since=`. True when `tags` is every tag, false when it is only those changed since `since`
        tags:
          type: array
          items: { $ref: "#/components/schemas/Tag" }
      example:
        ap: { fw: "0.1.0", board: c6-supermini, board_name: ESP32-C6, uptime_s: 86400, channel: 25, max_tags: 64, table_full: false, poll_s: 0, reset: poweron }
        tags:
          - mac: "00000123456789A8"
            seen_s_ago: 12
            battery_mv: 2950
            rssi: -61
            fw: 100
            model: "2.9"
            draw_failed: false
            content_id: 2914470401
            shown_content_id: 2914470401
            pending: false
            poll_s: 120
            config: { poll_s: 120, max_poll_s: null, lost_ap_s: null, long_poll_s: null, long_after_min: null }
            config_pending: false
            content_error: null
            ota: true
            signal: { rssi: [-62, -61, -63, -61], lost: [0, 0, 1, 0], retry: [0, 1, 0, 0], polls: 1440, lost_total: 3, retries: 5, tag_rssi: 196, tag_lqi: 108 }
            image: true
            image_id: 3522432519
            shown_image_id: 3522432519
            fw_update: { version: 0.3.0, received: 21840, size: 53248 }

    TagDeleted:
      type: object
      additionalProperties: false
      required: [mac, deleted]
      properties:
        mac: { $ref: "#/components/schemas/Mac" }
        deleted: { const: true }

    TagConfig:
      type: object
      properties:
        poll_s: { type: [integer, "null"], minimum: 10, maximum: 3600, description: "Poll interval in seconds; null: the AP default" }
        max_poll_s: { type: [integer, "null"], minimum: 10, maximum: 3600, description: "Longest interval when the tag backs off; null: built in" }
        lost_ap_s: { type: [integer, "null"], minimum: 60, maximum: 65535, description: 'Seconds without the AP before "No AP found"; 65535 = never; null: built in' }
        long_poll_s: { type: [integer, "null"], minimum: 60, maximum: 65535, description: "Interval once the AP has been gone for long_after_min; null: built in (3600)" }
        long_after_min: { type: [integer, "null"], minimum: 10, maximum: 65535, description: "Minutes without the AP before long_poll_s; 65535 = never; null: built in (1440)" }

    TagConfigFields:
      type: object
      required: [mac, poll_s, config, config_pending]
      properties:
        mac: { $ref: "#/components/schemas/Mac" }
        poll_s: { type: [integer, "null"], minimum: 0, maximum: 3600, description: "The interval the AP sends this tag; null: the tag's built-in one" }
        config: { $ref: "#/components/schemas/TagCfg" }
        config_pending: { type: boolean, description: The tag has not confirmed these settings yet }

    TagConfigReply:
      allOf: [{ $ref: "#/components/schemas/TagConfigFields" }]
      unevaluatedProperties: false

    TagConfigChanged:
      allOf:
        - $ref: "#/components/schemas/TagConfigFields"
        - type: object
          required: [changed]
          properties:
            changed: { type: boolean, description: "false: the tag already had these settings" }
      unevaluatedProperties: false

    ApConfig:
      type: object
      description: At least one of the keys
      properties:
        poll_s:
          type: [integer, "null"]
          minimum: 0
          maximum: 3600
          description: |
            `0` = tags keep their built-in interval (60 s), `10`–`3600` = that many seconds,
            `null` = back to the value set in menuconfig (`ESL_NEXT_POLL_S`).
        webhook:
          type: [string, "null"]
          maxLength: 127
          pattern: "^http://[^/]"
          description: |
            `http://host[:port][/path]` the AP posts the health report to when it changes
            (plain HTTP, at most 127 characters), `null` or `""` = no webhook. `422` on an AP
            built without the webhook.
        tx_power:
          type: [integer, "null"]
          minimum: -24
          maximum: 20
          description: |
            The radio's transmit power in dBm, `null` = back to the value set in menuconfig
            (`ESL_TX_POWER_DBM`, 10). The EU (EN 300 328) allows 20 dBm EIRP and 10 dBm/MHz,
            about 13 dBm EIRP for 802.15.4: with an antenna of G dBi, the EU limit is about
            13 − G. Above that only where more is allowed. `422` on an AP without a radio (the stub, the sniffer).
        ntp:
          type: [string, "null"]
          maxLength: 63
          pattern: "^[A-Za-z0-9][A-Za-z0-9.-]*$"
          description: |
            The NTP server the AP sets its clock from once it is on WiFi: a host name or IPv4
            address. `null` or `""` = back to the one set in menuconfig (`ESL_NTP_SERVER`).
            Used at once, no restart.
        tz:
          type: [string, "null"]
          maxLength: 63
          pattern: "^([A-Za-z]{3,}|<[A-Za-z0-9+-]+>)[+-]?[0-9][A-Za-z0-9+,./:<>-]*$"
          description: |
            The time zone for the AP's local time, as a POSIX TZ string (`CET-1CEST,M3.5.0,M10.5.0/3`
            for Norway; tzdata names such as `Europe/Oslo` are not understood). `null` or
            `""` = UTC. The clock itself and `at` stay in UTC; local time is for what the AP
            fills in itself (dates, data sources).

    ApConfigReply:
      type: object
      additionalProperties: false
      required: [poll_s, builtin_poll_s, webhook]
      properties:
        poll_s: { type: integer, minimum: 0, maximum: 3600, description: The default now }
        builtin_poll_s: { type: integer, minimum: 0, maximum: 3600, description: The value set in menuconfig }
        webhook: { type: [string, "null"], maxLength: 127, description: "The webhook URL, null when off" }
        tx_power: { type: integer, minimum: -24, maximum: 20, description: "The radio's transmit power in dBm now; left out on an AP without a radio" }
        builtin_tx_power: { type: integer, minimum: -24, maximum: 20, description: The value set in menuconfig }
        ntp: { type: [string, "null"], maxLength: 63, description: "The NTP server in use, null when none. Left out by an AP without scheduling (no clock)" }
        builtin_ntp: { type: [string, "null"], maxLength: 63, description: "The server set in menuconfig, which `ntp` null goes back to" }
        tz: { type: [string, "null"], maxLength: 63, description: "The POSIX time zone, null for UTC" }

    Health:
      type: object
      additionalProperties: false
      required: [problems, ok, tags, with_problems, silent, unseen, draw_failed, low_battery, content_error]
      properties:
        problems:
          type: array
          description: Every tag with at least one problem, in table order
          items:
            type: object
            additionalProperties: false
            required: [mac, problems, seen_s_ago, battery_mv]
            properties:
              mac: { $ref: "#/components/schemas/Mac" }
              problems:
                type: array
                minItems: 1
                items: { type: string, enum: [silent, unseen, draw_failed, low_battery, content_error] }
              seen_s_ago: { type: [integer, "null"], minimum: 0, description: "Seconds since its last poll; null: not seen since the AP started" }
              battery_mv: { type: [integer, "null"], minimum: 0, description: "From its last poll; 0: the tag cannot measure it" }
        ok: { type: boolean, description: No tag has a problem }
        tags: { type: integer, minimum: 0, description: Tags in the table }
        with_problems: { type: integer, minimum: 0, description: Length of `problems` }
        silent: { type: integer, minimum: 0, description: Tags that have not polled for `silent_s` }
        unseen: { type: integer, minimum: 0, description: Tags from NVS that have not polled since the AP started }
        draw_failed: { type: integer, minimum: 0, description: Tags whose last drawing failed }
        low_battery: { type: integer, minimum: 0, description: Tags below `battery_mv` }
        content_error: { type: integer, minimum: 0, description: Tags whose content is held back (`content_error` in `GET /api/tags`) }
        changed: { type: integer, minimum: 0, description: "Only in the webhook: tags whose problems differ from the last report" }
      example:
        problems:
          - { mac: "00000123456789A8", problems: [silent], seen_s_ago: 1260, battery_mv: 2950 }
          - { mac: "00000123456789A9", problems: [draw_failed, low_battery], seen_s_ago: 12, battery_mv: 2380 }
        ok: false
        tags: 12
        with_problems: 2
        silent: 1
        unseen: 0
        draw_failed: 1
        low_battery: 1
        content_error: 0

    WifiSet:
      type: object
      description: "`ssid` is required unless `token` or `hostname` is given"
      properties:
        ssid:
          type: [string, "null"]
          maxLength: 32
          description: The network name, at most 32 bytes; `""` or `null` forgets the saved network
        password:
          type: [string, "null"]
          maxLength: 63
          description: Empty or missing for an open network, otherwise 8–63 printable ASCII characters (WPA2)
        token:
          type: [string, "null"]
          minLength: 8
          maxLength: 128
          description: A new API token, 8–128 printable ASCII characters without spaces; missing or `null` keeps the current one
        hostname:
          type: [string, "null"]
          minLength: 1
          maxLength: 32
          pattern: "^[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?$"
          description: The AP's name on the network (DHCP and mDNS), letters, digits and `-`; missing or `null` keeps it

    WifiStatus:
      type: object
      additionalProperties: false
      required: [mode, ssid, connected, setup_ssid, token_set, networks]
      properties:
        mode:
          type: string
          enum: [sta, setup, sta+setup, "off"]
          description: |
            `sta` = joining or joined the saved network, `setup` = nothing saved, only the
            setup network, `sta+setup` = the saved network has not answered and both run,
            `off` = WiFi did not start.
        ssid: { type: [string, "null"], description: "The saved network, `null` if none" }
        connected: { type: boolean, description: Has an IP on the saved network }
        ip: { type: string, description: Only while connected }
        rssi: { type: integer, description: "Signal of the saved network in dBm, only while connected" }
        setup_ssid: { type: [string, "null"], description: "The setup network's name while it is open, e.g. `openesl-1A2B`" }
        token_set: { type: boolean, description: "An API token is set; until then every HTTP request gets `401`. The token itself is never shown" }
        hostname: { type: string, description: "The AP's name on the network, `openesl-xxxx` (the digits of its setup network) on a new AP and `openesl` on one set up with 0.6.0 or older, unless changed: what the router shows, and `<hostname>.local`" }
        networks:
          type: array
          maxItems: 16
          description: The last scan, strongest first; empty until a scan has run
          items:
            type: object
            additionalProperties: false
            required: [ssid, rssi]
            properties:
              ssid: { type: string }
              rssi: { type: integer }
      example:
        mode: sta
        ssid: Butikken
        connected: true
        ip: 192.168.1.40
        rssi: -58
        setup_ssid: null
        token_set: true
        hostname: openesl
        networks: [{ ssid: Butikken, rssi: -58 }, { ssid: Gjest, rssi: -71 }]

    OtaInfo:
      type: object
      additionalProperties: false
      required: [slot, version, slot_size, other_slot, other_version, confirmed, display, chip, uploading]
      properties:
        slot: { type: string, description: "The app slot that runs, `ota_0` or `ota_1`" }
        version: { type: string, description: The running firmware's version (the VERSION file) }
        slot_size: { type: integer, minimum: 0, description: Bytes an image may have }
        other_slot: { type: [string, "null"], description: "The slot a new image goes to; `null` with a one-slot partition table" }
        other_version: { type: [string, "null"], description: "The version in the other slot, `null` when it holds no valid image" }
        confirmed:
          type: boolean
          description: |
            The running firmware is kept. A new image is kept once WiFi has an address or an
            API request was answered (this one counts); one that gets to neither within three
            minutes is given up, and the AP restarts into the old one. Older firmware
            does not say.
        display: { type: boolean, description: "The firmware has the status screen (openesl-ap-lcd); older firmware does not say" }
        chip: { type: string, description: "The chip the firmware is built for (esp32c6, esp32c5); an image for another chip is refused. Older firmware does not say" }
        uploading: { type: boolean, description: An upload in parts is in progress }
        radio: { $ref: "#/components/schemas/RadioInfo" }
      example: { slot: ota_0, version: 0.2.0, slot_size: 1572864, other_slot: ota_1, other_version: 0.1.0, confirmed: true, display: false, chip: esp32c6, uploading: false }

    RadioInfo:
      type: object
      additionalProperties: false
      description: Only on an AP with a radio coprocessor on UART (ESP32-S3 + C6 on cable)
      required: [up, version, fw, link, ota, display]
      properties:
        up: { type: boolean, description: The radio answers the AP and runs with its settings }
        version: { type: [string, "null"], description: "The radio's firmware version (the VERSION file); `null` before the AP heard it, or from a radio before 0.8.2" }
        fw: { type: [string, "null"], description: "The radio program's own version (1.1: takes firmware over the cable); `null` before the AP heard it" }
        link: { type: [integer, "null"], description: "The link version the radio speaks (2: firmware over the cable); `null` before the AP heard it" }
        ota: { type: boolean, description: "The radio takes new firmware through `POST /api/ota`; false: only over USB" }
        display: { type: [boolean, "null"], description: "The radio has the 0.96\" screen (the -lcd image); `null` when it does not say" }
      example: { up: true, version: 0.8.2, fw: "1.1", link: 2, ota: true, display: false }

    OtaReply:
      type: object
      additionalProperties: false
      required: [received, total]
      properties:
        received: { type: integer, minimum: 0, description: Bytes written so far }
        total: { type: integer, minimum: 1 }
        slot: { type: string, description: "After the last part: the slot the AP restarts into" }
        version: { type: string, description: "After the last part: the version of the new image" }
        restarting: { type: boolean, description: "After the last part: the AP restarts in one second (false for the radio's image)" }
        radio: { type: boolean, description: "After the last part of the radio coprocessor's image: it went to the radio, which restarts into it" }
      example: { received: 1048576, total: 1048576, slot: ota_1, version: 0.2.0, restarting: true }

    ModelName:
      type: string
      enum: ["2.9", "1.54"]

    LayoutInfoFields:
      type: object
      required: [model, version, size, binary_size, layouts]
      properties:
        model: { $ref: "#/components/schemas/ModelName" }
        version: { type: [integer, "null"], minimum: 1, maximum: 4294967295, description: "The version of the file the AP draws with (CRC-32 of the compiled file); null: no file" }
        size: { type: integer, minimum: 0, maximum: 8192, description: Bytes of JSON }
        binary_size: { type: integer, minimum: 0, maximum: 4096, description: Bytes of the compiled file }
        layouts: { type: array, items: { type: string }, description: The layout names in the file }

    LayoutInfo:
      allOf: [{ $ref: "#/components/schemas/LayoutInfoFields" }]
      unevaluatedProperties: false

    LayoutList:
      type: object
      additionalProperties: false
      required: [max_size, max_binary_size, board, limits, layouts]
      properties:
        max_size: { type: integer, minimum: 1, description: "Bytes of JSON a layout file may have (limits.jsonBytes); 8192 on every board so far" }
        max_binary_size: { type: integer, minimum: 1, description: "Bytes a compiled layout file may have (limits.fileBytes)" }
        board:
          type: string
          description: The AP board the firmware is built for (ap/boards/), e.g. c6-supermini or s3-n16r8-c6
          examples: [c6-supermini]
        limits: { $ref: "#/components/schemas/LayoutLimits" }
        layouts: { type: array, items: { $ref: "#/components/schemas/LayoutInfo" } }

    LayoutLimits:
      type: object
      description: >-
        What one layout file may hold on this AP, named as in the web page's renderer.limits. The
        board sets runs, rects, lines, icons, fileBytes and jsonBytes ("limits" in
        ap/boards/<board>/board.json; boards with PSRAM allow more), so a file one AP accepts can be
        too big for another. The designer shows these for the AP it is connected to.
      additionalProperties: false
      required: [runs, rects, lines, icons, barcodes, qrs, fileBytes, jsonBytes, fields, fixedTextBytes]
      properties:
        runs: { type: integer, minimum: 1, description: "Lines of text per screen (each text element counts the most lines it can use); 32 on the ESP32-C6" }
        rects: { type: integer, minimum: 1, description: "rect elements plus invert/highlight/red_invert text per screen; 20 on the ESP32-C6" }
        lines: { type: integer, minimum: 1, description: "line elements per screen; 16 on the ESP32-C6" }
        icons: { type: integer, minimum: 1, description: "icon elements per screen; 8 on the ESP32-C6" }
        barcodes: { type: integer, const: 1, description: barcode elements per layout }
        qrs: { type: integer, const: 1, description: QR elements per layout }
        fileBytes: { type: integer, minimum: 1, description: "Bytes of the compiled file; 4096 on the ESP32-C6" }
        jsonBytes: { type: integer, minimum: 1, description: "Bytes of the JSON file; 8192 on the ESP32-C6" }
        fields: { type: integer, const: 6, description: Fields per layout }
        fixedTextBytes: { type: integer, const: 64, description: Bytes per fixed text (Latin-1) }

    LayoutStored:
      allOf:
        - $ref: "#/components/schemas/LayoutInfoFields"
        - type: object
          required: [changed, content_errors, content_errors_total]
          properties:
            version: { type: integer }
            changed: { type: boolean, description: "false: the same file as before; nothing was written" }
            content_errors:
              type: array
              maxItems: 16
              description: "Tags of this model whose content no longer fits the file (the first 16): a barcode, QR code or number too big for its box. The file is stored all the same; their content is held back (`content_error` in `GET /api/tags`) until they get new content or a file it fits"
              items:
                type: object
                additionalProperties: false
                required: [mac, error]
                properties:
                  mac: { type: string, pattern: "^[0-9A-F]{16}$" }
                  error: { type: string, description: What does not fit, as `PUT /api/tags` would say }
            content_errors_total: { type: integer, minimum: 0, description: "How many tags `content_errors` would list without its limit" }
      unevaluatedProperties: false

    TagFirmware:
      type: object
      additionalProperties: false
      required: [model, version]
      description: Without an image, only `model` and `version` (null).
      properties:
        model: { $ref: "#/components/schemas/ModelName" }
        version: { type: [string, "null"], description: "The firmware version (the VERSION file it was built from); null: no image" }
        size: { type: integer, minimum: 1024, maximum: 61440, description: Bytes each tag downloads }
        crc: { type: string, pattern: "^[0-9A-F]{8}$", description: CRC-32 of the image }
        to:
          description: "Who it is offered to: every tag of the model (`all`), or these tags"
          oneOf:
            - { type: string, const: all }
            - { type: array, maxItems: 16, items: { $ref: "#/components/schemas/Mac" } }
        tags:
          type: object
          additionalProperties: false
          required: [updated, pending, failed, no_ota, not_chosen]
          description: The tags of this model the AP has seen since it started
          properties:
            updated: { type: integer, minimum: 0, description: Run this version }
            pending: { type: integer, minimum: 0, description: "Run another version, take updates and the image is for them; they get it over their next polls" }
            failed: { type: integer, minimum: 0, description: "Rejected it, or went back to their old firmware; not offered it again" }
            no_ota: { type: integer, minimum: 0, description: "Run another version and cannot take updates (older firmware, or no SPI flash)" }
            not_chosen: { type: integer, minimum: 0, description: "Run another version, and the image is not for them (`to`)" }
        progress:
          type: object
          additionalProperties: false
          required: [received, total]
          description: "Bytes the tags it is for have fetched, out of the bytes they need: `updated` among them count whole, `failed` not at all"
          properties:
            received: { type: integer, minimum: 0 }
            total: { type: integer, minimum: 0 }
      example: { model: "1.54", version: 0.3.0, size: 53248, crc: 1A2B3C4D, to: all, tags: { updated: 12, pending: 3, failed: 0, no_ota: 1, not_chosen: 0 }, progress: { received: 700416, total: 798720 } }

    TagFirmwareList:
      type: object
      additionalProperties: false
      required: [max_size, part_max, images]
      properties:
        max_size: { type: integer, const: 61456, description: Bytes a file may have (header and image) }
        part_max: { type: integer, const: 24576, description: Bytes a part may have }
        images: { type: array, items: { $ref: "#/components/schemas/TagFirmware" } }

    TagFirmwareReply:
      type: object
      additionalProperties: false
      required: [received, total]
      properties:
        received: { type: integer, minimum: 0, description: Bytes stored so far }
        total: { type: integer, minimum: 1 }
        model: { $ref: "#/components/schemas/ModelName" }
        version: { type: string, description: "After the last part: the version the AP now offers" }
        size: { type: integer, description: "After the last part: bytes of the image" }
        crc: { type: string, pattern: "^[0-9A-F]{8}$" }
      example: { model: "1.54", version: 0.3.0, size: 53248, crc: 1A2B3C4D, received: 53264, total: 53264 }

    LayoutDeleted:
      type: object
      additionalProperties: false
      required: [model, deleted]
      properties:
        model: { $ref: "#/components/schemas/ModelName" }
        deleted: { const: true }

    SourceConfig:
      type: object
      additionalProperties: false
      patternProperties: { "^_": true }
      required: [id, type, lat, lon, layout]
      properties:
        id: { type: string, pattern: "^[a-z0-9_-]{1,16}$", description: "The source's name, unique on the AP" }
        type: { type: string, enum: [met], description: "`met`: the forecast from MET Norway (api.met.no locationforecast 2.0)" }
        lat: { type: number, minimum: -90, maximum: 90, description: "Degrees north, kept to 4 decimals" }
        lon: { type: number, minimum: -180, maximum: 180, description: "Degrees east, kept to 4 decimals" }
        place: { type: string, maxLength: 32, default: "", description: "The place's name, value `{place}` (at most 32 bytes of UTF-8)" }
        lang: { type: string, enum: [nb, en], default: nb, description: "The language of `{desc}` and `{dir}`" }
        every_min: { type: integer, minimum: 30, maximum: 1440, default: 30, description: "Minutes between fetches; never before the last answer's `Expires`" }
        layout:
          type: string
          description: |
            A layout in the layout file of each tag's model, or `text` (built in, four lines).
            A tag whose model has no such layout, or whose content does not fit it, is
            counted in `tags_failed` and keeps what it shows.
        fields:
          type: array
          minItems: 1
          maxItems: 6
          items: { type: string, maxLength: 48 }
          description: |
            The content's fields, each a template of text and `{value}`s (`types.met.values`
            in `GET`). Left out: `types.met.fields`, the fields of the weather template.
        tags:
          type: array
          maxItems: 32
          items: { $ref: "#/components/schemas/Mac" }
          default: []
          description: The tags that show this source. A tag can be in one source only.
        status:
          $ref: "#/components/schemas/SourceStatus"
          description: "In GET; PUT ignores it, so a source can be sent back as it came"

    SourcesConfig:
      type: object
      additionalProperties: false
      required: [sources]
      properties:
        sources:
          type: array
          maxItems: 8
          items: { $ref: "#/components/schemas/SourceConfig" }

    SourceStatus:
      type: object
      additionalProperties: false
      required: [ok, fetched_at, tried_at, data_at, next_at, http, tags_set, tags_changed, tags_failed, error, values]
      properties:
        ok: { type: boolean, description: "There is data, and the last fetch and the content went well" }
        fetched_at: { type: [integer, "null"], description: "Unix s of the last answer with data (200, or 304 Not Modified); null: none yet" }
        tried_at: { type: [integer, "null"], description: "Unix s of the last try" }
        data_at: { type: [integer, "null"], description: "When the source made its data (MET: the forecast's `updated_at`)" }
        next_at: { type: [integer, "null"], description: "Unix s of the next fetch; 0 or null: as soon as the AP knows the time and is free" }
        http: { type: integer, description: "The HTTP status of the last try; 0: no answer (no network, DNS, TLS)" }
        tags_set: { type: integer, minimum: 0, description: "Tags given content by the last run" }
        tags_changed: { type: integer, minimum: 0, description: "Of them, the ones whose content changed (and are sent it)" }
        tags_failed: { type: integer, minimum: 0, description: "Tags that could not get it (layout missing for their model, content too long)" }
        error: { type: [string, "null"], description: "What went wrong in the last run; null when it went well" }
        values:
          type: object
          additionalProperties: { type: string }
          description: The values of the last answer, as the field templates see them

    Source:
      allOf:
        - { $ref: "#/components/schemas/SourceConfig" }
      required: [id, type, lat, lon, place, lang, every_min, layout, fields, tags, status]

    SourcesReply:
      type: object
      additionalProperties: false
      required: [types, sources]
      properties:
        types:
          type: object
          additionalProperties:
            type: object
            additionalProperties: false
            required: [values, fields]
            properties:
              values: { type: array, items: { type: string }, description: "The `{value}`s a field template can use" }
              fields: { type: array, items: { type: string }, description: "The templates used when a source gives no `fields`" }
        sources:
          type: array
          items: { $ref: "#/components/schemas/Source" }

    SourcesRefresh:
      type: object
      additionalProperties: false
      required: [refreshing]
      properties:
        refreshing: { type: integer, minimum: 0, description: "The number of sources" }

    LayoutFile:
      type: object
      description: |
        Keys starting with `_` and `description` are comments. Besides this structure the AP
        checks that every box is inside the screen (296×128 or 200×200), that a text box is
        at least as high as its smallest font (plus 2 × 4 px for `invert`/`highlight`), at
        most 32 text lines, 20 rectangles, 16 lines and 8 icons per layout, and at most 4096
        bytes compiled.
      additionalProperties: false
      patternProperties: { "^_": true }
      required: [format, version, model, layouts]
      properties:
        format: { const: esl-layouts }
        version: { const: 1 }
        model: { $ref: "#/components/schemas/ModelName", description: The same as the model in the URL }
        description: { type: string }
        icons:
          type: object
          maxProperties: 16
          description: Small pictures that `icon` elements draw, by name
          propertyNames: { pattern: "^[a-z][a-z0-9_]{0,15}$" }
          additionalProperties: { $ref: "#/components/schemas/Icon" }
        layouts:
          type: array
          minItems: 1
          maxItems: 16
          description: Layout n in this list is layout 0x10 + n on the radio; clients only see the names
          items: { $ref: "#/components/schemas/Layout" }

    Layout:
      type: object
      additionalProperties: false
      patternProperties: { "^_": true }
      required: [name, fields, elements]
      properties:
        name:
          type: string
          pattern: "^[a-z0-9][a-z0-9._-]{0,30}$"
          not: { enum: [price, text] }
          description: Unique in the file
        description: { type: string }
        fields:
          type: array
          minItems: 1
          maxItems: 6
          items: { type: string, pattern: "^[a-z][a-z0-9_]{0,15}$" }
          description: The order clients send `fields` in
        elements:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/Element" }
          description: Drawn in order (all rectangles, lines, icons, then the barcode and QR code, then all text)

    Icon:
      type: object
      additionalProperties: false
      required: [w, h, data]
      properties:
        w: { type: integer, minimum: 1, maximum: 128 }
        h: { type: integer, minimum: 1, maximum: 128 }
        data:
          type: string
          description: |
            Base64 of the picture row by row from the top, (w + 7) / 8 bytes per row, bit 7 of a
            row's first byte its leftmost pixel; a 1 bit is drawn in the element's colour, a 0 bit
            leaves what is under it

    Element:
      type: object
      additionalProperties: false
      patternProperties: { "^_": true }
      required: [type, x, y]
      description: |
        Every element needs `x` and `y`, and all but `icon` with `icon` (whose size is the icon's) `w` and `h`.
      properties:
        type:
          type: string
          enum: [text, rect, barcode, line, icon, qr]
          description: |
            `text`: one field in a box; `rect`: a box, filled or only its border; `barcode`: one
            field as a barcode; `line`: a straight line; `icon`: one of the file's `icons`, named in the layout or by a field; `qr`: one
            field as a QR code (black, with a white quiet zone of 2 modules inside the box)
        radius: { type: integer, minimum: 0, default: 0, description: "rect only: corner radius in pixels, at most half the shorter side" }
        border: { type: integer, minimum: 0, default: 0, description: "rect only: 0 = filled, else only a border this many pixels wide (at most half the shorter side)" }
        direction:
          type: string
          enum: [down, up]
          default: down
          description: "line only: the line runs from the top-left to the bottom-right corner of its box (`down`) or from the bottom-left to the top-right (`up`); a box 1 px high or wide is a straight line"
        width: { type: integer, minimum: 1, maximum: 16, default: 1, description: "line only: in pixels. A straight line is exactly this thick, (width - 1) / 2 of it above or left of its box, with square ends; a slanted one reaches width / 2 past its box and its ends are round" }
        icon: { type: string, description: "icon only: a name from the file's `icons`; give this or `field`" }
        field:
          type: [string, integer]
          description: |
            text, barcode and qr: a name from `fields`, or its index. icon, instead of `icon`:
            the field whose text names the icon (`sun`, `rain`), so the content picks it; the
            element then needs `w` and `h`, the icon is centred in that box, and nothing is
            drawn when the text names no icon of the file or the icon is larger than the box
        text:
          type: string
          minLength: 1
          description: |
            text only, instead of `field`: a fixed text stored in the layout file (at most 64 bytes in
            Latin-1, 32 different texts per file), so it does not take room in the content
        symbology:
          type: string
          enum: [code128, ean13]
          description: |
            barcode only, required. `code128`: ASCII 32-127; `ean13`: 12 digits, or 13 with a correct
            check digit. Content whose barcode field cannot be encoded or does not fit the box is refused with 422.
        module:
          type: integer
          minimum: 0
          maximum: 8
          default: 0
          description: "barcode: module width in pixels, at most 4; qr: module size in pixels, at most 8; 0 = the largest that fits the box"
        ecc:
          type: string
          enum: [L, M, Q, H]
          default: M
          description: |
            qr only: error correction level (about 7, 15, 25 or 30 % of the code can be lost). Content
            whose QR field is longer than the largest version the box holds takes is refused with 422.
        x: { type: integer, minimum: 0 }
        y: { type: integer, minimum: 0 }
        w: { type: integer, minimum: 1 }
        h: { type: integer, minimum: 1 }
        fonts:
          type: array
          minItems: 1
          maxItems: 3
          items: { type: string, enum: [small, medium, mid, large] }
          description: |
            text only: tried in order, the first the text fits in is used. `small` 17 px,
            `medium` 24 px, `mid` 36 px, `large` 52 px; `mid` and `large` only have digits and ` ,-.:`.
        align: { type: string, enum: [left, center, right], default: left }
        valign: { type: string, enum: [top, middle, bottom], default: top }
        lines: { type: integer, minimum: 0, maximum: 3, default: 0, description: "0: as many as the box holds" }
        decimals:
          oneOf:
            - { type: integer, enum: [0, 2] }
            - { type: string, enum: [auto, dash, keep] }
          description: |
            text only: draws a number such as a price the same way whatever the client sends
            (`1299.9`, `1299,90`, `1 299,90`, `199,-`). `2`: `1299,90`; `0`: `1300` (rounded);
            `auto`: `199` or `199,90`; `dash`: `199,-` or `199,90`; `keep`: the decimals as sent,
            with a decimal comma. One dot and no comma is the decimal sign (`1.299` is 1,299).
            Text that is not a number is drawn as sent. A formatted number is drawn on one line.
            At most 8 elements per layout with a number format. Left out: no format.
        thousands:
          type: boolean
          default: false
          description: "text only: a space between every three digits, `1 299,90`"
        color:
          type: string
          enum: [black, white, frame, invert, highlight]
          default: black
          description: |
            `frame` is only drawn with `"frame": true`; text also `invert` (white text in a
            black box) and `highlight` (inverted with `"price_highlight": true`, else black)
