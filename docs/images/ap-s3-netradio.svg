<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <title>ESP32-S3 AP with a wireless ESP32-C6 radio on the same WiFi network</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/>
    </marker>
  </defs>
  <rect width="760" height="420" fill="#ffffff"/>

  <!-- router -->
  <rect x="305" y="30" width="150" height="70" rx="10" fill="#f4f6f7" stroke="#34495e" stroke-width="2"/>
  <text x="380" y="60" text-anchor="middle" font-weight="bold" font-size="16" fill="#1b2631">WiFi router</text>
  <text x="380" y="80" text-anchor="middle" fill="#34495e" font-size="12">your network</text>

  <!-- ESP32-S3 -->
  <rect x="30" y="150" width="210" height="140" rx="10" fill="#e8eef7" stroke="#34495e" stroke-width="2"/>
  <text x="135" y="182" text-anchor="middle" font-weight="bold" font-size="16" fill="#1b2631">ESP32-S3 N16R8</text>
  <text x="135" y="204" text-anchor="middle" fill="#34495e">the AP</text>
  <text x="135" y="228" text-anchor="middle" fill="#34495e" font-size="12">dashboard, API, label table,</text>
  <text x="135" y="244" text-anchor="middle" fill="#34495e" font-size="12">draws the images</text>
  <text x="135" y="274" text-anchor="middle" fill="#34495e" font-size="12">own USB charger</text>

  <!-- ESP32-C6 -->
  <rect x="400" y="150" width="190" height="140" rx="10" fill="#eaf5ea" stroke="#34495e" stroke-width="2"/>
  <text x="495" y="182" text-anchor="middle" font-weight="bold" font-size="16" fill="#1b2631">ESP32-C6</text>
  <text x="495" y="204" text-anchor="middle" fill="#34495e">the radio</text>
  <text x="495" y="228" text-anchor="middle" fill="#34495e" font-size="12">answers the labels itself</text>
  <text x="495" y="244" text-anchor="middle" fill="#34495e" font-size="12">from what the S3 sent it</text>
  <text x="495" y="274" text-anchor="middle" fill="#34495e" font-size="12">own USB charger</text>

  <!-- labels -->
  <rect x="640" y="140" width="96" height="48" rx="4" fill="#fdfefe" stroke="#1b2631" stroke-width="2"/>
  <text x="688" y="161" text-anchor="middle" font-size="12" fill="#1b2631">Coffee</text>
  <text x="688" y="179" text-anchor="middle" font-weight="bold" font-size="14" fill="#1b2631">79.90</text>
  <rect x="656" y="212" width="64" height="64" rx="4" fill="#fdfefe" stroke="#1b2631" stroke-width="2"/>
  <text x="688" y="240" text-anchor="middle" font-size="12" fill="#1b2631">Tea</text>
  <text x="688" y="258" text-anchor="middle" font-weight="bold" font-size="14" fill="#1b2631">29.90</text>
  <text x="688" y="300" text-anchor="middle" fill="#34495e" font-size="12">labels</text>

  <!-- WiFi: S3 to router, router to C6 -->
  <line x1="170" y1="148" x2="318" y2="104" stroke="#2471a3" stroke-width="3" stroke-dasharray="8 5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="200" y="112" text-anchor="middle" fill="#2471a3" font-size="12">WiFi</text>
  <line x1="420" y1="104" x2="480" y2="148" stroke="#2471a3" stroke-width="3" stroke-dasharray="8 5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="540" y="112" text-anchor="middle" fill="#2471a3" font-size="12">WiFi: a sync every 10 s,</text>
  <text x="540" y="128" text-anchor="middle" fill="#2471a3" font-size="12">started by the radio</text>

  <!-- 802.15.4: C6 to labels -->
  <line x1="594" y1="205" x2="636" y2="176" stroke="#1e8449" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="594" y1="235" x2="652" y2="242" stroke="#1e8449" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="615" y="330" text-anchor="middle" fill="#1e8449" font-size="12">802.15.4: a reply within 20 ms</text>

  <!-- no wire -->
  <line x1="244" y1="220" x2="396" y2="220" stroke="#c0392b" stroke-width="2" stroke-dasharray="3 6"/>
  <text x="320" y="212" text-anchor="middle" fill="#c0392b" font-size="12">no wire</text>

  <!-- notes -->
  <text x="30" y="360" fill="#1b2631">The S3 can sit anywhere on the network; the radio sits near the labels, where the WiFi is good.</text>
  <text x="30" y="382" fill="#1b2631">Changes reach a label up to 10 s later (30 s when busy) than over a cable, and the radio</text>
  <text x="30" y="404" fill="#1b2631">hears fewer labels while WiFi has its antenna. The cabled S3 + C6 has none of these limits.</text>
</svg>
