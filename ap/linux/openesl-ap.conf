# openesl-ap settings: one "name = value" per line, the same names as the command-line
# options without "--" (openesl-ap --help). The command line wins over this file.

# The 802.15.4 radio: sim[:N[,ms]] for simulated tags (no radio)
radio = sim

# HTTP API and dashboard. Port 80 needs root or CAP_NET_BIND_SERVICE (the systemd unit has it).
listen = :80

# The built-in channel (11-26) and PAN id; the dashboard can move the AP to another channel.
channel = 25
pan = 4553

# API token: made at the first start and kept in <data>/token (mode 0600) when not given here.
# Set it here only if this file is readable by root and the service's user alone: the
# service reads it as that user, so a world-readable file would give the token away.
#token = change-me

# Poll interval sent to tags (seconds), 0 = each tag keeps its own.
#next-poll = 0

#verbose = 1
