<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenESL AP API</title>
  <meta name="description" content="The HTTP API of the OpenESL access point, with test requests through the bridge in tools/esl-client.">
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="img/favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <style>
    html, body { margin: 0; background: #fff; }
    html.dark, html.dark body { background: #0f0f0f; }
  </style>
  <script>
    // light or dark as the theme button of index.html set it (js/theme.js), otherwise the system's
    var dark = matchMedia("(prefers-color-scheme: dark)").matches;
    try { var t = localStorage.getItem("openesl.theme"); if (t === "light" || t === "dark") dark = t === "dark"; } catch (e) {}
    if (dark) document.documentElement.classList.add("dark");
    // the button pressed in the page around this one (the API tab): draw again in the new theme
    addEventListener("storage", function (e) { if (e.key === "openesl.theme" || e.key === null) location.reload(); });
  </script>
</head>
<body>
  <!-- The API reference, made by Scalar from docs/openapi.yaml (copied next to this page
       by web/build.py). Shown in the API tab of index.html, and works on its own too. -->
  <div id="app"></div>
  <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference@1.72.3/dist/browser/standalone.js"></script>
  <script>
    Scalar.createApiReference("#app", {
      url: "openapi.yaml",
      darkMode: dark,
      forceDarkModeState: dark ? "dark" : "light",
      hideDarkModeToggle: true,
      withDefaultFonts: false,
      showDeveloperTools: "never",
      agent: { disabled: true },
      mcp: { disabled: true },
      hideClientButton: false,
      defaultHttpClient: { targetKey: "shell", clientKey: "curl" },
      authentication: { preferredSecurityScheme: "token" },
      persistAuth: true,
    });
  </script>
</body>
</html>
