# CI for every pull request: builds and tests the tag and AP firmware (firmware.yml) and the
# web page (web/), and attaches the finished page to the run as the "web-page" artifact.
# On master the page is built, tested and published to GitHub Pages; the firmware is not
# built again there (its pull requests did that), unless there is no release yet.
#
# The flasher on the published page serves the firmware of the latest GitHub release, so
# people flash released firmware. Before the first release, and on pull requests, it serves
# the firmware built in this run. release.yml starts this workflow after each release.
#
# One-time setup: Settings -> Pages -> Source: "GitHub Actions".
name: CI and web page

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which firmware the page serves: the latest release, or (pull requests, or before the
  # first release) the firmware built in this run. On master the firmware was already built
  # and tested on its pull requests, so it is only built again when there is no release.
  source:
    runs-on: ubuntu-24.04
    outputs:
      release: ${{ steps.rel.outputs.release }}
    steps:
      - id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rel=""
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            rel=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName 2>/dev/null || true)
          fi
          echo "release=$rel" >> "$GITHUB_OUTPUT"

  firmware:
    needs: source
    if: needs.source.outputs.release == ''
    uses: ./.github/workflows/firmware.yml

  page:
    needs: [source, firmware]
    if: ${{ !cancelled() && needs.source.result == 'success' && (needs.firmware.result == 'success' || needs.firmware.result == 'skipped') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: 3.1.74
          actions-cache-folder: emsdk-cache
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: API spec against the AP code (docs/openapi.yaml)
        run: |
          python3 -c "import yaml" 2>/dev/null || sudo apt-get install -y python3-yaml
          make -C ap/test openapi
      - name: Build the page and the renderer
        run: |
          python3 web/build.py
          python3 web/build.py --native
      - name: Tests (renderer against the native build, flasher against a simulated ZBS_Flasher)
        run: node --test web/test/*.test.mjs
      - uses: actions/download-artifact@v8
        if: needs.source.outputs.release == ''
        with:
          path: fw
      - name: Add the firmware (latest release, otherwise this build)
        env:
          GH_TOKEN: ${{ github.token }}
          rel: ${{ needs.source.outputs.release }}
        run: |
          if [ -n "$rel" ]; then
            echo "Firmware from release $rel"
            gh release download "$rel" --repo "$GITHUB_REPOSITORY" --dir rel --pattern 'openesl-*.bin'
            FIRMWARE_RELEASE="$rel" python3 web/build.py --firmware \
              "rel/openesl-tag-2.9-$rel.bin" "rel/openesl-tag-1.54-$rel.bin" "rel/openesl-ap-esp32c6-$rel.bin" \
              "rel/openesl-ap-esp32c6-lcd-$rel.bin"
          else
            echo "No release yet: firmware from this build"
            python3 web/build.py --firmware fw/tag-firmware/tag-29.bin fw/tag-firmware/tag-154.bin fw/ap-firmware/openesl-ap.bin \
              fw/ap-firmware/openesl-ap-lcd.bin
          fi
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: web/dist
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'pull_request'
        with:
          name: web-page
          path: web/dist

  deploy:
    if: ${{ !cancelled() && needs.page.result == 'success' && github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
    needs: page
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
