# CI for every pull request: builds and tests the tag and AP firmware (firmware.yml) and the
# web page (web/), and attaches the finished page to the run as the "web-page" artifact.
# On master the page is built, tested and published to GitHub Pages; the firmware is not
# built again there (its pull requests did that), unless there is no release yet. A pull
# request builds only the firmware its files can change (the source job): one that changes
# only documentation (docs/, wiki/, *.md) builds none, one that does not touch the AP no AP.
#
# The flasher on the published page serves the firmware of the latest GitHub release, so
# people flash released firmware. Before the first release, and on pull requests, it serves
# the firmware built in this run. release.yml starts this workflow after each release.
#
# One-time setup: Settings -> Pages -> Source: "GitHub Actions".
# tools/check.py runs the same steps locally: change both together.
name: CI and web page

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which firmware the page serves: the latest release, or (pull requests that change the AP,
  # or before the first release) the firmware built in this run. On master the firmware was
  # already built and tested on its pull requests, so it is only built again when there is no
  # release. A pull request builds only what its files can break (the largest of):
  #   docs/, wiki/, templates/, *.md, LICENSE   no firmware (templates/ is published by the page)
  #   VERSION, tag/, sim/, tools/               the firmware tests and the tag firmware, no AP
  #   web/, tag/designs/, templates/home/weather.json
  #                                             the AP boards that pack them (ap/main/webui.py):
  #                                             c6-supermini (the smallest flash) and s3-n16r8-c6
  #                                             (the Design tab, ESL_WEB_DESIGNER)
  #   anything else (ap/, shared/, .github/, tag/src/ and tag/fonts/, which esl_core compiles,
  #   tools/fw_version.py, which names the AP's version)    every AP board and radio
  # A file moved counts by its old path too.
  # The page takes the latest release's firmware unless every AP board was built.
  source:
    runs-on: ubuntu-24.04
    outputs:
      release: ${{ steps.rel.outputs.release }}
      firmware: ${{ steps.rel.outputs.firmware }}
      ap: ${{ steps.rel.outputs.ap }}
    steps:
      - id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest() { gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName 2>/dev/null || true; }
          level=3   # 0 no firmware, 1 no AP, 2 the AP boards with the web page, 3 every AP board
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            rel=$(latest)
          else
            files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/${{ github.event.pull_request.number }}/files" -q '.[] | .filename, (.previous_filename // empty)')
            if [ -n "$files" ]; then level=0; fi
            for f in $files; do
              case "$f" in
                templates/home/weather.json|tag/designs/*|web/*) l=2 ;;
                docs/*|wiki/*|templates/*|*.md|LICENSE|.github/ISSUE_TEMPLATE/*) l=0 ;;
                tools/fw_version.py|tag/src/*|tag/fonts/*) l=3 ;;
                VERSION|tag/*|sim/*|tools/*) l=1 ;;
                *) l=3 ;;
              esac
              if [ "$l" -gt "$level" ]; then level=$l; echo "Level $l: $f"; fi
            done
            rel=""
            if [ "$level" -lt 3 ]; then rel=$(latest); fi
            # before the first release the page needs this run's firmware, every board of it
            if [ -z "$rel" ]; then level=3; fi
          fi
          firmware=yes; ap=all
          case "$level" in 0) firmware=no ;; 1) ap=none ;; 2) ap=web ;; esac
          # on master (and by hand) the firmware is only built when there is no release
          if [ "${{ github.event_name }}" != "pull_request" ] && [ -n "$rel" ]; then firmware=no; fi
          echo "Firmware: $firmware, AP boards: $ap, the page takes: ${rel:-this build}"
          echo "release=$rel" >> "$GITHUB_OUTPUT"
          echo "firmware=$firmware" >> "$GITHUB_OUTPUT"
          echo "ap=$ap" >> "$GITHUB_OUTPUT"

  firmware:
    needs: source
    if: needs.source.outputs.firmware == 'yes'
    uses: ./.github/workflows/firmware.yml
    with:
      ap: ${{ needs.source.outputs.ap }}

  page:
    needs: [source, firmware]
    if: ${{ !cancelled() && needs.source.result == 'success' && (needs.firmware.result == 'success' || needs.firmware.result == 'skipped') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: 3.1.74
          actions-cache-folder: emsdk-cache
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: API spec against the AP code (docs/openapi.yaml)
        run: |
          python3 -c "import yaml" 2>/dev/null || sudo apt-get install -y python3-yaml
          make -C ap/test openapi
      - name: Build the page and the renderer
        run: |
          python3 web/build.py
          python3 web/build.py --native
      - name: Tests (renderer against the native build, flasher against a simulated ZBS_Flasher)
        run: node --test web/test/*.test.mjs
      - name: Wiki links (tools/check_wiki.py; here rather than in wiki.yml, which saves a runner)
        run: python3 tools/check_wiki.py
      - uses: actions/download-artifact@v8
        if: needs.source.outputs.release == ''
        with:
          path: fw
      - name: Add the firmware (latest release, otherwise this build)
        env:
          GH_TOKEN: ${{ github.token }}
          rel: ${{ needs.source.outputs.release }}
        run: |
          if [ -n "$rel" ]; then
            echo "Firmware from release $rel"
            gh release download "$rel" --repo "$GITHUB_REPOSITORY" --dir rel --pattern 'openesl-*.bin'
            # one tag image per model in shared/models.json (build.py tells them apart by their headers)
            # and one AP image per board in ap/boards/ (a board added after the release is skipped)
            FIRMWARE_RELEASE="$rel" python3 web/build.py --firmware \
              $(python3 shared/models.py names | while read -r build name; do printf 'rel/openesl-tag-%s-%s.bin ' "$name" "$rel"; done) \
              $(python3 ap/build.py --release | while read -r artifact release; do printf 'rel/%s-%s.bin ' "$release" "$rel"; done)
          else
            echo "No release yet: firmware from this build"
            python3 web/build.py --firmware \
              $(python3 shared/models.py builds | tr ' ' '\n' | sed 's|.*|fw/tag-firmware/tag-&.bin|') \
              $(python3 ap/build.py --release | while read -r artifact release; do printf 'fw/ap-firmware/%s.bin ' "$artifact"; done)
          fi
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: web/dist
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'pull_request'
        with:
          name: web-page
          path: web/dist

  deploy:
    if: ${{ !cancelled() && needs.page.result == 'success' && github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
    needs: page
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
