# CI for every pull request: builds and tests the tag and AP firmware (firmware.yml) and the
# web page (web/), and attaches the finished page to the run as the "web-page" artifact.
# On master the page is built, tested and published to GitHub Pages; the firmware is not
# built again there (its pull requests did that), unless there is no release yet. A pull
# request that changes only documentation (docs/, wiki/, *.md) builds no firmware either.
#
# The flasher on the published page serves the firmware of the latest GitHub release, so
# people flash released firmware. Before the first release, and on pull requests, it serves
# the firmware built in this run. release.yml starts this workflow after each release.
#
# One-time setup: Settings -> Pages -> Source: "GitHub Actions".
# tools/check.py runs the same steps locally: change both together.
name: CI and web page

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which firmware the page serves: the latest release, or (pull requests that change more
  # than documentation, or before the first release) the firmware built in this run. On master the firmware was already built
  # and tested on its pull requests, so it is only built again when there is no release.
  source:
    runs-on: ubuntu-24.04
    outputs:
      release: ${{ steps.rel.outputs.release }}
    steps:
      - id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest() { gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName 2>/dev/null || true; }
          rel=""
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            rel=$(latest)
          else
            # a pull request that changes only documentation (docs/, wiki/, *.md) or layout
            # templates (templates/, which the page publishes and no firmware holds) builds no
            # firmware: its page takes the latest release's, as on master
            files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/${{ github.event.pull_request.number }}/files" -q '.[].filename')
            fw=no
            for f in $files; do
              case "$f" in
                docs/*|wiki/*|templates/*|*.md|LICENSE|.github/ISSUE_TEMPLATE/*) ;;
                *) fw=yes; echo "Firmware is built: $f"; break ;;
              esac
            done
            if [ "$fw" = no ] && [ -n "$files" ]; then
              rel=$(latest)
              echo "Only documentation or templates changed: no firmware build, the page takes release $rel's"
            fi
          fi
          echo "release=$rel" >> "$GITHUB_OUTPUT"

  firmware:
    needs: source
    if: needs.source.outputs.release == ''
    uses: ./.github/workflows/firmware.yml

  page:
    needs: [source, firmware]
    if: ${{ !cancelled() && needs.source.result == 'success' && (needs.firmware.result == 'success' || needs.firmware.result == 'skipped') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: 3.1.74
          actions-cache-folder: emsdk-cache
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: API spec against the AP code (docs/openapi.yaml)
        run: |
          python3 -c "import yaml" 2>/dev/null || sudo apt-get install -y python3-yaml
          make -C ap/test openapi
      - name: Build the page and the renderer
        run: |
          python3 web/build.py
          python3 web/build.py --native
      - name: Tests (renderer against the native build, flasher against a simulated ZBS_Flasher)
        run: node --test web/test/*.test.mjs
      - uses: actions/download-artifact@v8
        if: needs.source.outputs.release == ''
        with:
          path: fw
      - name: Add the firmware (latest release, otherwise this build)
        env:
          GH_TOKEN: ${{ github.token }}
          rel: ${{ needs.source.outputs.release }}
        run: |
          if [ -n "$rel" ]; then
            echo "Firmware from release $rel"
            gh release download "$rel" --repo "$GITHUB_REPOSITORY" --dir rel --pattern 'openesl-*.bin'
            # one tag image per model in shared/models.json (build.py tells them apart by their headers)
            # and one AP image per board in ap/boards/ (a board added after the release is skipped)
            FIRMWARE_RELEASE="$rel" python3 web/build.py --firmware \
              $(python3 shared/models.py names | while read -r build name; do printf 'rel/openesl-tag-%s-%s.bin ' "$name" "$rel"; done) \
              $(python3 ap/build.py --release | while read -r artifact release; do printf 'rel/%s-%s.bin ' "$release" "$rel"; done)
          else
            echo "No release yet: firmware from this build"
            python3 web/build.py --firmware \
              $(python3 shared/models.py builds | tr ' ' '\n' | sed 's|.*|fw/tag-firmware/tag-&.bin|') \
              $(python3 ap/build.py --release | while read -r artifact release; do printf 'fw/ap-firmware/%s.bin ' "$artifact"; done)
          fi
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: web/dist
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'pull_request'
        with:
          name: web-page
          path: web/dist

  deploy:
    if: ${{ !cancelled() && needs.page.result == 'success' && github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
    needs: page
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
