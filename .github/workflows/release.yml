# Publishes a GitHub release for the version in the VERSION file. Three ways to start it:
#
#   - merge a pull request that changes VERSION on master: the release v<VERSION> is made
#     from that commit (the usual way; nothing to tag by hand)
#   - Actions -> Release -> Run workflow: releases VERSION from the chosen branch, if that
#     release does not exist yet
#   - push a tag yourself: git tag v0.2.0 && git push origin v0.2.0 (it must match VERSION;
#     a suffix such as v0.2.0-rc1 makes a pre-release, which the web page does not use)
#
# The firmware is built by firmware.yml and attached with SHA-256 sums; the release notes
# list the pull requests merged since the previous release. The files are named after the
# release, but the AP and the tags each carry the version of the release they last changed
# in (tools/fw_version.py): the release job checks that the images say what the script
# says, and the notes (tools/release_notes.py) sort the pull requests by what they changed
# and name the version each firmware carries. After a normal release, web.yml
# runs again so the flashers on the web page serve it.
name: Release

on:
  push:
    tags: ["v*"]
    branches: [master]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v7
      - name: Upgrade instructions for VERSION in docs/release.md
        run: python3 tools/release_notes.py --check
      - name: Which release (and does the tag match VERSION)
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
            t="${tag#v}"
            if [ "${t%%-*}" != "$version" ]; then
              echo "::error::Tag $tag does not match VERSION ($version). Bump VERSION on master and tag that commit."
              exit 1
            fi
          else
            tag="v$version"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $tag exists already, nothing to do"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  firmware:
    needs: check
    if: needs.check.outputs.release == 'true'
    uses: ./.github/workflows/firmware.yml
    permissions:
      contents: read
      actions: read   # firmware.yml's ap-size job asks for it

  release:
    needs: [check, firmware]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    steps:
      # for the model list (shared/models.json) and the AP boards (ap/boards/), which name the files,
      # and the whole history for tools/fw_version.py
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: fw
      - name: The images carry the versions of tools/fw_version.py
        run: |
          python3 tools/fw_version.py --all | tee versions.txt
          python3 - <<'EOF'
          import glob, json, sys
          sys.path.insert(0, "web")
          from build import image_version
          # "ap 0.4.7", "tag 0.4.7", "tag-29 0.4.7", "tag-154 0.4.5": the AP images carry the
          # AP version, each model's image its own version
          versions = dict(line.split() for line in open("versions.txt") if line.strip())
          want = {"fw/ap-firmware/%s-ota.bin" % json.load(open(b))["artifact"]: versions["ap"]
                  for b in glob.glob("ap/boards/*/board.json")}
          for part, v in versions.items():
              if part.startswith("tag-"):
                  want["fw/tag-firmware/%s-ota.bin" % part] = v
          bad = {f: v for f, v in ((f, image_version(f)) for f in want) if v != want[f]}
          for f, v in bad.items():
              print("::error::%s carries version %s, tools/fw_version.py says %s" % (f, v, want[f]))
          sys.exit(1 if bad else 0)
          EOF
      - name: Name the files after the release
        env:
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          mkdir out
          # tags: openesl-tag-<name>-$TAG.bin per model in shared/models.json (2.9, 1.54, ...)
          python3 shared/models.py names | while read -r build name; do
            cp "fw/tag-firmware/tag-$build.bin" "out/openesl-tag-$name-$TAG.bin"
            cp "fw/tag-firmware/tag-$build-ota.bin" "out/openesl-tag-$name-$TAG-ota.bin"
          done
          # AP: "release" in ap/boards/*/board.json (openesl-ap-esp32c6-$TAG.bin, ...)
          python3 ap/build.py --release | while read -r artifact release; do
            cp "fw/ap-firmware/$artifact.bin" "out/$release-$TAG.bin"
            # the radio on the network (netradio) has no -ota.bin (ap/build.py)
            if [ -f "fw/ap-firmware/$artifact-ota.bin" ]; then cp "fw/ap-firmware/$artifact-ota.bin" "out/$release-$TAG-ota.bin"; fi
          done
          # the AP as a Linux program (firmware.yml, linux-ap): openesl-ap-linux-<arch>-$TAG
          for f in fw/linux-ap/openesl-ap-*; do
            cp "$f" "out/openesl-ap-linux-${f##*/openesl-ap-}-$TAG"
          done
          (cd out && sha256sum *.bin openesl-ap-linux-* > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          pre=""
          case "$TAG" in *-*) pre="--prerelease";; esac
          # a pushed tag is used as it is; otherwise the tag is made on the commit this run built
          if [ "$GITHUB_REF_TYPE" = tag ]; then where="--verify-tag"; else where="--target $GITHUB_SHA"; fi
          # the pull requests since the previous release, sorted by what they changed (AP
          # firmware, tag firmware, web page, the rest), with the version each firmware carries
          prev=$(python3 -c "import sys; sys.path.insert(0, 'tools'); import fw_version; t = [t for t in fw_version.release_tags() if t != '$TAG']; print(t[0] if t else '')")
          if [ -n "$prev" ]; then
            python3 tools/release_notes.py "$prev" "$GITHUB_SHA" > notes.md
            printf '\n**Full changelog**: https://github.com/%s/compare/%s...%s\n' "$GITHUB_REPOSITORY" "$prev" "$TAG" >> notes.md
          else
            echo "First release." > notes.md
          fi
          cat notes.md
          gh release create "$TAG" out/* --repo "$GITHUB_REPOSITORY" \
            --title "OpenESL $TAG" --notes-file notes.md $where $pre
      - name: Publish the web page with the new firmware
        if: ${{ !contains(needs.check.outputs.tag, '-') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run web.yml --repo "$GITHUB_REPOSITORY" --ref master

  # The Linux AP as a Docker image, ghcr.io/<owner>/openesl-ap:<version> (and :latest for a normal
  # release), for linux/amd64, linux/arm64 and linux/arm/v7, from the binaries the release carries
  # (ap/linux/Dockerfile.release). The first push makes the package private on GHCR: set it public
  # once under the package's settings.
  docker:
    needs: [check, firmware, release]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: linux-ap
          path: linux-ap
      - name: The binaries under Docker's platform names
        run: |
          mkdir ctx
          cp ap/linux/Dockerfile.release ctx/Dockerfile
          cp linux-ap/openesl-ap-x86_64 ctx/openesl-ap-amd64
          cp linux-ap/openesl-ap-aarch64 ctx/openesl-ap-arm64
          cp linux-ap/openesl-ap-armv7 ctx/openesl-ap-arm
          chmod +x ctx/openesl-ap-*
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push
        env:
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/openesl-ap"
          tags="-t $image:${TAG#v}"
          case "$TAG" in *-*) ;; *) tags="$tags -t $image:latest" ;; esac
          docker buildx build --push --platform linux/amd64,linux/arm64,linux/arm/v7 \
            --label org.opencontainers.image.source="https://github.com/$GITHUB_REPOSITORY" \
            --label org.opencontainers.image.version="${TAG#v}" \
            --label org.opencontainers.image.licenses=MIT \
            $tags ctx
