# Builds the tag firmware (every model in shared/models.json, after the host tests) and the AP
# firmware (every board in ap/boards/).
# Called by web.yml (every push and pull request) and release.yml (a VERSION bump merged to master, a tag v*, or by hand), so CI and
# releases build the firmware the same way. Artifacts:
#   tag-firmware: tag-<build>.bin (bootloader and application, for the flasher) and tag-<build>-ota.bin
#                 (the application with its header, for PUT /api/tag-firmware): tag-29*.bin, tag-154*.bin
#   ap-firmware:  <artifact>.bin (bootloader, partition table and app merged, written at 0) and
#                 <artifact>-ota.bin (the app alone, for POST /api/ota) per board (ap/build.py):
#                 openesl-ap*.bin (C6), openesl-ap-lcd*.bin (C6 with the status screen),
#                 openesl-ap-c5-n16r8*.bin (ESP32-C5 with PSRAM), openesl-ap-s3-n16r8*.bin (ESP32-S3 host),
#                 and the radio coprocessor images for the S3 (openesl-ap-radio-c6*.bin,
#                 openesl-ap-radio-c6-lcd*.bin; their -ota.bin goes to the radio through the AP)
#   linux-ap:     openesl-ap-<arch> (the AP as a Linux program, ap/linux) for armv7, aarch64 and
#                 x86_64, only when every AP build is asked for (inputs.ap all)
# The AP and the tags each get the version of the release they last changed in
# (tools/fw_version.py), so the images of a release that changed only one of them are the
# previous ones again for the other; the "Versions" step shows what this run built.
# The AP is built one job per board and per radio (ap/build.py --jobs), side by side, and
# collected into the ap-firmware artifact. ccache keeps the compiled objects between runs
# (most of them are ESP-IDF's own, which do not change), so a build need not compile them
# again. The ap-size job adds the flash budget table (each image's free space in its app slot,
# ap/build.py --sizes) to the run's summary and fails an image with less than 64 KB free.
# web.yml asks for fewer AP builds on pull requests that
# cannot change the AP (inputs.ap); release.yml always builds them all.
# tools/check.py runs the same steps locally: change both together.
name: Firmware

on:
  workflow_call:
    inputs:
      ap:
        description: "Which AP builds: all (every board and radio), web (c6-supermini and s3-n16r8-c6, which pack the web page) or none"
        type: string
        default: all

permissions:
  contents: read

jobs:
  tag-firmware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the release tags: tools/fw_version.py gives the AP and the tags their versions
      - name: Cache SDCC 4.5.0
        id: sdcc-cache
        uses: actions/cache@v6
        with:
          path: ~/sdcc
          key: sdcc-4.5.0-amd64
      - name: Install SDCC 4.5.0
        if: steps.sdcc-cache.outputs.cache-hit != 'true'
        run: |
          curl -sSL -o sdcc.tar.bz2 https://sourceforge.net/projects/sdcc/files/sdcc-linux-amd64/4.5.0/sdcc-4.5.0-amd64-unknown-linux2.5.tar.bz2/download
          mkdir -p "$HOME/sdcc" && tar xjf sdcc.tar.bz2 -C "$HOME/sdcc" --strip-components=1
      - run: echo "$HOME/sdcc/bin" >> "$GITHUB_PATH"
      - name: Model registry (the generated files match shared/models.json)
        run: python3 tools/gen_models.py --check
      - name: Host tests (every model in shared/models.json)
        run: python3 tools/check.py --strict tag
      - name: End-to-end simulation (tag firmware against the AP core, sim/README.md)
        run: |
          make -C sim SAN=1
          make -C sim serial
      - name: Tag firmware over the air from each release and back (sim/upgrade.py, #307)
        run: make -C sim upgrade SAN=1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sim-screens
          path: |
            sim/build/*/screens/
            sim/build/upgrade/**/*.png
      - name: Versions (tools/fw_version.py)
        run: python3 tools/fw_version.py --all
      - name: Build firmware (every model in shared/models.json)
        run: python3 tools/check.py --strict tag-fw   # writes out/tag-<build>.bin and out/tag-<build>-ota.bin
      - uses: actions/upload-artifact@v7
        with:
          name: tag-firmware
          path: out/

  ap-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Host tests (AP core, with AddressSanitizer)
        run: |
          # zxing-cpp reads back the barcodes the AP draws (ap/test/test_barcode_decode.py); the
          # same list also has what the tool tests below need (flash-tui)
          python3 -m pip install --user -r tools/dev/requirements.txt
          make -C ap/test SAN=1
      - name: The AP as a Linux program (ap/linux, simulated tags, with AddressSanitizer)
        run: make -C ap/linux test SAN=1
      - name: Tool tests (esl-client against a fake AP, power budget, BLE probe, release notes, AP flash budget, sniffer, flash-tui)
        run: |
          (cd tools/esl-client && python3 -m unittest -v test_esl_client)
          (cd tools/power-budget && python3 -m unittest -v test_power_budget test_measure)
          (cd tools/ble-probe && python3 -m unittest -v test_btsnoop test_scan)
          (cd tools && python3 -m unittest -v test_release_notes test_ap_budget)   # docs/release.md has a summary and upgrade instructions for VERSION; the AP flash budget
          (cd tools/sniffer && python3 -m unittest -v test_sniff)
          (cd tools/flash-tui && python3 -m unittest discover -v -s tests)

  # One build job per AP board and per radio firmware (ap/build.py --jobs), side by side:
  # one after another they took 13 minutes, about 1.5 minutes each
  ap-jobs:
    if: inputs.ap != 'none'
    runs-on: ubuntu-24.04
    outputs:
      jobs: ${{ steps.jobs.outputs.jobs }}
    steps:
      - uses: actions/checkout@v7
      - id: jobs
        env:
          AP: ${{ inputs.ap }}
        run: |
          jobs=$(python3 ap/build.py --jobs)
          # web: the smallest flash (C6) and a board with the Design tab (ESL_WEB_DESIGNER)
          if [ "$AP" = web ]; then jobs=$(echo "$jobs" | jq -c '[.[] | select(.name == "c6-supermini" or .name == "s3-n16r8-c6")]'); fi
          echo "jobs=$jobs" >> "$GITHUB_OUTPUT"

  ap-build:
    needs: ap-jobs
    name: ap-build (${{ matrix.job.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        job: ${{ fromJSON(needs.ap-jobs.outputs.jobs) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the release tags: tools/fw_version.py gives the AP and the tags their versions
      - name: Versions (tools/fw_version.py)
        run: python3 tools/fw_version.py --all
      # the boards with the Design tab (ESL_WEB_DESIGNER) pack the renderer (ap/main/webui.py);
      # the radio firmware has no web page
      - uses: mymindstorm/setup-emsdk@v16
        if: ${{ !contains(matrix.job.args, '/') }}
        with:
          version: 3.1.74
          actions-cache-folder: emsdk-cache
      - name: Renderer for the AP's Design tab (web/dist/wasm/)
        if: ${{ !contains(matrix.job.args, '/') }}
        run: python3 web/build.py --wasm
      # the newest cache of this build (a pull request also finds master's, which the
      # releases fill); ccache checks every object against its sources and flags
      - uses: actions/cache@v6
        with:
          path: .ccache
          # "@" ends the name: radio-c6 must not take radio-c6-lcd's cache
          key: ccache-${{ matrix.job.name }}@${{ github.sha }}
          restore-keys: ccache-${{ matrix.job.name }}@
      - name: Build ${{ matrix.job.name }} (ESP-IDF v5.5.5), merged into one image
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.5
          target: esp32c6   # only for the action; ap/build.py takes the chip from each board
          path: ap
          extra_docker_args: -e IDF_CCACHE_ENABLE=1 -e CCACHE_DIR=/app/${{ github.repository }}/.ccache -e CCACHE_MAXSIZE=200M
          command: python build.py ${{ matrix.job.args }} && ccache -s
      # also when the build failed the flash budget (ap/build.py), so ap-size can show the table
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: ap-build-${{ matrix.job.name }}
          path: ap/out/
          if-no-files-found: ignore

  # The flash budget (ap/build.py --sizes): how much of its app slot each image leaves free,
  # in the run's summary, with the change against the base branch on a pull request. The
  # partition table cannot change on an AP in the field without a USB flash, so the 4 MB C6
  # has to keep room: under 64 KB free fails (each build job fails too), under 128 KB warns.
  ap-size:
    needs: [ap-jobs, ap-build]
    if: ${{ !cancelled() && needs.ap-jobs.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read   # the images of the base branch's last pull request, to compare with
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: ap-build-*
          path: fw
          merge-multiple: true
      # The base branch is not built on push (web.yml), so its images are those of the CI runs of
      # the newest pull requests merged into it (a squash merge has the same files). A pull request
      # that built only some boards (ap: web) leaves the others to an older one: each image is
      # taken from the newest build that has it, looking through up to 5 builds.
      - name: The base branch's images
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          mkdir -p base
          # an image has a base once base/ has its size.json or its app (-ota.bin, older builds)
          missing() {
            for f in fw/*.size.json; do
              a=$(basename "$f" .size.json)
              [ -f "base/$a.size.json" ] || [ -f "base/$a-ota.bin" ] || echo "$a"
            done
          }
          git fetch -q --depth 30 origin "$BASE_REF"
          used="" builds=0
          for sha in $(git rev-list --first-parent -n 30 FETCH_HEAD); do
            [ -n "$(missing)" ] && [ "$builds" -lt 5 ] || break
            pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/pulls" --jq '[.[] | select(.merged_at != null)][0] | "\(.number) \(.head.sha)"' 2>/dev/null) || continue
            set -- $pr
            [ "$#" = 2 ] && [ "$1" != null ] || continue
            for run in $(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$2" --jq '.workflow_runs[] | select(.path | startswith(".github/workflows/web.yml")) | .id'); do
              rm -rf one
              if gh run download "$run" --repo "$GITHUB_REPOSITORY" --name ap-firmware --dir one 2>/dev/null; then
                cp -r --update=none one/. base/    # the newer build's image wins
                used="$used #$1"
                builds=$((builds + 1))
                break
              fi
            done
          done
          if [ -n "$used" ]; then
            echo "BUDGET_BASE_NAME=$BASE_REF (the builds of$used, newest first)" >> "$GITHUB_ENV"
          else
            echo "No images of a pull request merged into $BASE_REF lately to compare with"
          fi
          echo "Without a base: $(missing | tr '\n' ' ')"
      - name: Flash budget (fails under 64 KB free)
        run: python3 ap/build.py --sizes fw --base base

  # the images of every board and radio in one artifact, as web.yml and release.yml take them
  ap-firmware:
    needs: ap-build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/upload-artifact/merge@v7
        with:
          name: ap-firmware
          pattern: ap-build-*

  # The AP as a Linux program (ap/linux, docs/linux-ap.md): static builds for armv7, aarch64 and
  # x86_64 with zig, with the Dashboard and the Design tab packed in, as linux-ap/openesl-ap-<arch>.
  # release.yml attaches them as openesl-ap-linux-<arch>-<version>.
  linux-ap:
    if: inputs.ap == 'all'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: 3.1.74
          actions-cache-folder: emsdk-cache
      - name: Renderer for the Design tab (web/dist/wasm/)
        run: python3 web/build.py --wasm
      - name: Build armv7, aarch64 and x86_64 (zig, static)
        run: |
          python3 -m pip install --user ziglang==0.17.1
          mkdir -p linux-ap
          for t in armv7 aarch64 x86_64; do
            make -C ap/linux TARGET=$t -j"$(nproc)"
            cp "ap/linux/build/$t/openesl-ap" "linux-ap/openesl-ap-$t"
          done
          file linux-ap/*
      - uses: actions/upload-artifact@v7
        with:
          name: linux-ap
          path: linux-ap/
      - name: The Docker image (ap/linux/Dockerfile) builds and serves the dashboard
        run: |
          docker build -f ap/linux/Dockerfile -t openesl-ap .
          docker run -d --name oe -p 18080:80 openesl-ap
          for i in $(seq 20); do curl -fs -o /dev/null localhost:18080/dashboard && break; sleep 1; done
          docker logs oe
          curl -fs -o /dev/null localhost:18080/dashboard
          docker rm -f oe
