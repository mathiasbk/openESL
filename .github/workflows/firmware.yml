# Builds the tag firmware (every model in shared/models.json, after the host tests) and the AP
# firmware (every board in ap/boards/).
# Called by web.yml (every push and pull request) and release.yml (a VERSION bump merged to master, a tag v*, or by hand), so CI and
# releases build the firmware the same way. Artifacts:
#   tag-firmware: tag-<build>.bin (bootloader and application, for the flasher) and tag-<build>-ota.bin
#                 (the application with its header, for PUT /api/tag-firmware): tag-29*.bin, tag-154*.bin
#   ap-firmware:  <artifact>.bin (bootloader, partition table and app merged, written at 0) and
#                 <artifact>-ota.bin (the app alone, for POST /api/ota) per board (ap/build.py):
#                 openesl-ap*.bin (C6), openesl-ap-lcd*.bin (C6 with the status screen),
#                 openesl-ap-c5-n16r8*.bin (ESP32-C5 with PSRAM)
# The AP and the tags each get the version of the release they last changed in
# (tools/fw_version.py), so the images of a release that changed only one of them are the
# previous ones again for the other; the "Versions" step shows what this run built.
# tools/check.py runs the same steps locally: change both together.
name: Firmware

on:
  workflow_call:

permissions:
  contents: read

jobs:
  tag-firmware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the release tags: tools/fw_version.py gives the AP and the tags their versions
      - name: Cache SDCC 4.5.0
        id: sdcc-cache
        uses: actions/cache@v6
        with:
          path: ~/sdcc
          key: sdcc-4.5.0-amd64
      - name: Install SDCC 4.5.0
        if: steps.sdcc-cache.outputs.cache-hit != 'true'
        run: |
          curl -sSL -o sdcc.tar.bz2 https://sourceforge.net/projects/sdcc/files/sdcc-linux-amd64/4.5.0/sdcc-4.5.0-amd64-unknown-linux2.5.tar.bz2/download
          mkdir -p "$HOME/sdcc" && tar xjf sdcc.tar.bz2 -C "$HOME/sdcc" --strip-components=1
      - run: echo "$HOME/sdcc/bin" >> "$GITHUB_PATH"
      - name: Model registry (the generated files match shared/models.json)
        run: python3 tools/gen_models.py --check
      - name: Host tests
        run: |
          # zxing-cpp reads back the barcodes the tag code draws (tag/test/test_label_barcode.py)
          python3 -m pip install --user zxing-cpp==3.1.1 pillow
          python3 tag/tools/build.py test
      - name: End-to-end simulation (tag firmware against the AP core, sim/README.md)
        run: |
          make -C sim SAN=1
          make -C sim serial
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sim-screens
          path: sim/build/*/screens/
      - name: Versions (tools/fw_version.py)
        run: python3 tools/fw_version.py --all
      - name: Build firmware (every model in shared/models.json)
        run: python3 tools/check.py --strict tag-fw   # writes out/tag-<build>.bin and out/tag-<build>-ota.bin
      - uses: actions/upload-artifact@v7
        with:
          name: tag-firmware
          path: out/

  ap-firmware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the release tags: tools/fw_version.py gives the AP and the tags their versions
      - name: Host tests (AP core, with AddressSanitizer)
        run: make -C ap/test SAN=1
      - name: Tool tests (esl-client against a fake AP, power budget)
        run: |
          (cd tools/esl-client && python3 -m unittest -v test_esl_client)
          (cd tools/power-budget && python3 -m unittest -v test_power_budget)
      - name: Versions (tools/fw_version.py)
        run: python3 tools/fw_version.py --all
      - name: Build AP for every board (ESP-IDF v5.5.5), each merged into one image
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.5
          target: esp32c6   # only for the action; ap/build.py takes the chip from each board
          path: ap
          command: python build.py
      - uses: actions/upload-artifact@v7
        with:
          name: ap-firmware
          path: ap/out/
